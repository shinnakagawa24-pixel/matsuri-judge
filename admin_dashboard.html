<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者集計 — 2025 YOKOHAMA Final</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap');
  :root{
    --field:#0e1320; --panel:#161d2e; --panel-2:#1d2740; --line:#2a3650;
    --ink:#eef2fb; --muted:#8b96ad; --gold:#f2b03d; --gold-dim:#9c7327;
    --signal:#5fd0c5; --danger:#e8705a; --silver:#c3ccdb;
    --display:'Oswald','Arial Narrow',system-ui,sans-serif;
    --body:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--field);background-image:radial-gradient(110% 60% at 50% -8%,#1a2440 0%,var(--field) 55%);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:960px;margin:0 auto;padding:18px 16px 60px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:11px;color:var(--gold);margin:0;}
  .title{font-family:var(--display);font-weight:600;font-size:24px;margin:3px 0 0;letter-spacing:.01em;}
  .sub{font-size:12px;color:var(--muted);margin:4px 0 0;}
  .count{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--signal);}

  .check{display:flex;align-items:center;gap:11px;padding:13px 16px;border-radius:12px;margin-bottom:16px;font-size:13.5px;border:1px solid;}
  .check.ok{border-color:var(--signal);background:rgba(95,208,197,.10);color:var(--signal);}
  .check.bad{border-color:var(--danger);background:rgba(232,112,90,.10);color:var(--danger);}
  .check .badge{font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:13px;white-space:nowrap;}
  .check small{color:var(--muted);font-size:11.5px;}

  .confirm{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-radius:12px;margin-bottom:16px;border:1px solid;flex-wrap:wrap;}
  .cf-label{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;}
  .confirm.waiting{border-color:var(--line);background:var(--panel);} .confirm.waiting .cf-label{color:var(--muted);}
  .confirm.ready{border-color:var(--signal);background:rgba(95,208,197,.08);} .confirm.ready .cf-label{color:var(--signal);}
  .confirm.confirmed{border-color:#3fbf6f;background:rgba(63,191,111,.14);} .confirm.confirmed .cf-label{color:#7fe6a3;}
  .confirm.stale{border-color:var(--danger);background:rgba(232,112,90,.12);} .confirm.stale .cf-label{color:var(--danger);}
  .cf-btn{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:11px 20px;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:#1a1305;cursor:pointer;white-space:nowrap;}
  .cf-btn:active{transform:scale(.98);}
  .cf-btn.unlock{background:transparent;color:var(--ink);border-color:var(--line);}
  .cf-btn.dis,.cf-btn[disabled]{opacity:.4;cursor:not-allowed;background:var(--panel-2);color:var(--muted);border-color:var(--line);}
  .btn.locked,.btn[disabled]{opacity:.4;cursor:not-allowed;}
  .lock-note{display:flex;align-items:center;font-size:11.5px;color:var(--muted);margin-right:auto;}

  .tie-warn{display:flex;align-items:center;gap:9px;padding:10px 14px;border:1px solid var(--danger);background:rgba(232,112,90,.10);border-radius:11px;color:var(--danger);font-size:12.5px;font-weight:600;margin-bottom:16px;}
  .tie-warn .wm{font-family:var(--display);letter-spacing:.06em;}

  .subs{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;margin-bottom:16px;}
  .subs-head{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--ink);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;}
  .subs-head span{color:var(--muted);font-family:var(--mono);letter-spacing:0;font-size:12px;}
  .subs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;}
  .subs-cell{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);border-left:3px solid var(--line);}
  .subs-cell.full{border-left-color:var(--signal);}
  .subs-cell.partial{border-left-color:var(--gold);}
  .subs-cell .sj{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .subs-cell .sc{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .subs-cell.full .sc{color:var(--signal);}
  .subs-cell.partial .sc{color:var(--gold);}

  .divtabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap;}
  .divtab{padding:9px 17px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.05em;cursor:pointer;}
  .divtab:hover{border-color:var(--gold-dim);color:var(--ink);}
  .divtab.active{background:var(--gold);color:#1a1305;border-color:var(--gold);}

  .awards{border:1px solid var(--gold-dim);border-radius:12px;background:rgba(242,176,61,.06);padding:13px 15px;margin:18px 0;}
  .awards-head{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--gold);margin-bottom:10px;}
  .awards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
  .award-cell{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);}
  .award-cell .ag{font-size:10.5px;color:var(--muted);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;}
  .award-cell .an{font-size:13.5px;font-weight:600;}
  .award-cell .af{font-family:var(--mono);font-size:12px;color:var(--gold);}

  .mawards{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;margin:18px 0;}
  .mawards-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--ink);}
  .msave-btn{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:7px 14px;border-radius:9px;border:1px solid var(--gold);background:var(--gold);color:#1a1305;cursor:pointer;}
  .msave-btn:active{transform:scale(.98);}
  .mawards-note{font-size:11.5px;color:var(--muted);margin:7px 0 12px;line-height:1.5;}
  .mawards-empty{font-size:12px;color:var(--muted);margin:6px 0;}
  .mawards-row{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px;margin-bottom:8px;}
  .ma-in{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:var(--body);font-size:13.5px;padding:9px 11px;outline:none;}
  .ma-in:focus{border-color:var(--gold);}
  .madd-btn{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:9px;width:100%;cursor:pointer;font-family:var(--body);font-size:13px;margin-top:2px;}
  .madd-btn:hover{border-color:var(--gold-dim);color:var(--ink);}

  .toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:14px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:border-color .15s,transform .06s;}
  .btn:hover{border-color:var(--gold-dim);}
  .btn:active{transform:scale(.99);}
  .btn.excel{background:var(--gold);color:#1a1305;border-color:var(--gold);}
  .btn .ic{font-family:var(--mono);font-weight:700;font-size:11px;border:1px solid currentColor;border-radius:5px;padding:1px 5px;opacity:.85;}

  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;}
  table{border-collapse:collapse;width:100%;min-width:720px;}
  thead th{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--muted);padding:11px 10px;text-align:center;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap;}
  thead th.l{text-align:left;}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:13px;vertical-align:middle;}
  tbody tr.band-row{cursor:pointer;transition:background .12s;}
  tbody tr.band-row:hover{background:var(--panel);}
  tbody tr.tie td{background:rgba(232,112,90,.08);}
  .c-rank{font-family:var(--mono);font-weight:700;font-size:18px;color:var(--gold);width:46px;}
  tr.tie .c-rank{color:var(--danger);}
  .c-no{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .c-div{font-family:var(--display);font-size:11px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
  .c-team{text-align:left;font-weight:500;font-size:13.5px;min-width:180px;}
  .c-team .caret{color:var(--gold-dim);font-size:11px;margin-right:7px;display:inline-block;transition:transform .15s;}
  tr.open .c-team .caret{transform:rotate(90deg);}
  .sc{font-family:var(--mono);font-weight:700;font-size:14px;}
  .sc .rk{display:block;font-family:var(--body);font-weight:500;font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.04em;}
  .c-final{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--gold);}
  tr.tie .c-final{color:var(--danger);}
  .tieflag{color:var(--danger);font-weight:700;margin-left:6px;}

  .prize{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.05em;padding:4px 10px;border-radius:20px;border:1px solid;white-space:nowrap;}
  .prize.gold{color:var(--gold);border-color:var(--gold-dim);background:rgba(242,176,61,.10);}
  .prize.silver{color:var(--silver);border-color:#586275;background:rgba(195,204,219,.07);}
  .prize.bronze{color:#c48a5a;border-color:#6b4f37;background:rgba(196,138,90,.08);}
  .prize.none{color:var(--muted);border-color:var(--line);}

  /* Pen + CG editable cells */
  .pen-in{width:46px;text-align:center;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:var(--mono);font-weight:700;font-size:13px;padding:5px 3px;outline:none;}
  .pen-in:focus{border-color:var(--gold);}
  .cg-toggle{font-family:var(--mono);font-weight:700;font-size:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:7px;padding:5px 9px;cursor:pointer;}
  .cg-toggle.no{color:var(--danger);border-color:var(--danger);}
  .cg-toggle.yes{color:var(--signal);border-color:#2f5e58;}

  /* detail */
  tr.detail-row td{padding:0;border-bottom:1px solid var(--line);}
  .detail{display:none;padding:16px 18px;background:var(--panel);}
  tr.detail-row.show .detail{display:block;}
  .fam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .fam-card{border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:var(--panel-2);}
  .fam-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .fam-name{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;}
  .fam-sub{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--gold);}
  .fam-sub small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:10px;margin-left:4px;}
  .jrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--muted);}
  .jrow .jn{color:var(--ink);}
  .jrow .jraw{font-family:var(--mono);}
  .jrow.muted{opacity:.4;text-decoration:line-through;}
  .fam-note{font-size:10.5px;color:var(--gold-dim);margin-top:8px;line-height:1.4;}

  .legend{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.7;}
  .legend code{font-family:var(--mono);color:var(--ink);background:var(--panel);padding:1px 6px;border-radius:5px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script>
/* ===================== 設定（一般部門） ===================== */
let EVENT={name:"",date:""};
const FB={DB_URL:"https://marching-matsuri-judge-default-rtdb.asia-southeast1.firebasedatabase.app",EVENT_ID:"shonan-2026"};
const FB_BASE=FB.DB_URL.replace(/\/+$/,'');
const cfgURL=`${FB_BASE}/events/${FB.EVENT_ID}/config.json`;
const scoresURL=`${FB_BASE}/events/${FB.EVENT_ID}/scores.json`;
const manualURL=`${FB_BASE}/events/${FB.EVENT_ID}/manualAwards.json`;
const confirmURL=`${FB_BASE}/events/${FB.EVENT_ID}/confirmed.json`;
let MANUAL_AWARDS=[];
let CONFIRM={state:'none',hash:null,at:null};
const ADMIN_OVERRIDE=new URLSearchParams(location.search).get('admin')==='1';
function scoreHash(sc){
  sc=sc||{}; const parts=[];
  Object.keys(sc).sort().forEach(jid=>{const bs=sc[jid]||{};
    Object.keys(bs).sort().forEach(bid=>{const e=bs[bid]||{};
      Object.keys(e).sort().forEach(f=>parts.push(jid+':'+bid+':'+f+'='+e[f]));});});
  const str=parts.join('|'); let h=5381;
  for(let i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))>>>0;} return String(h);
}
function missingCount(){let m=0;BANDS.forEach(b=>JUDGES.forEach(j=>{const rv=rawVals(j.id,b.id);if(!(rv&&rv.every(v=>v!=null)))m++;}));return m;}
function putConfirm(){return fetch(confirmURL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(CONFIRM)}).catch(()=>{});}
async function doConfirm(){CONFIRM={state:'confirmed',hash:scoreHash(SCORES),at:Date.now()};await putConfirm();render();}
async function doUnconfirm(){CONFIRM={state:'none',hash:null,at:null};await putConfirm();render();}
const esc=s=>String(s==null?'':s).replace(/"/g,'&quot;');
let lastFetch=null, liveOK=false;
let FACTOR={GE:2.0,Visual:1.5,Music:1.5};
const FAM_MAX={GE:40,Visual:30,Music:30};

let CAPTIONS=[
  {id:"ge1",family:"GE"},{id:"ge2",family:"GE"},{id:"ge3",family:"GE"},{id:"ge4",family:"GE"},
  {id:"va1",family:"Visual",cg:false},{id:"va2",family:"Visual",cg:false},
  {id:"cg1",family:"Visual",cg:true},{id:"cg2",family:"Visual",cg:true},
  {id:"ma1",family:"Music"},{id:"ma2",family:"Music"},
  {id:"mb1",family:"Music"},{id:"mb2",family:"Music"},
  {id:"mp1",family:"Music"},{id:"mp2",family:"Music"}
];
let JUDGES=[
  {id:"jge1",name:"大川勝己",captionId:"ge1"},{id:"jge2",name:"田中義之",captionId:"ge2"},
  {id:"jge3",name:"阿佐美圭祐",captionId:"ge3"},{id:"jge4",name:"野上孟",captionId:"ge4"},
  {id:"jva1",name:"井上隆介",captionId:"va1"},{id:"jva2",name:"大澤沙希",captionId:"va2"},
  {id:"jcg1",name:"藤田奈緒美",captionId:"cg1"},{id:"jcg2",name:"笹原名津美",captionId:"cg2"},
  {id:"jma1",name:"清水康弘",captionId:"ma1"},{id:"jma2",name:"片岡優斗",captionId:"ma2"},
  {id:"jmb1",name:"中村裕治",captionId:"mb1"},{id:"jmb2",name:"仲本克也",captionId:"mb2"},
  {id:"jmp1",name:"櫻井公美",captionId:"mp1"},{id:"jmp2",name:"長田英之",captionId:"mp2"}
];
let BANDS=[
  {id:"b1",no:1,division:"MB/小",name:"Spirit of Stars",hasCG:true},
  {id:"b2",no:2,division:"MB/小",name:"DER GLANZ",hasCG:true},
  {id:"b3",no:3,division:"MB/中",name:"MARCHING BAND COURAGE",hasCG:true},
  {id:"b4",no:4,division:"MB/中",name:"THE FOCUS",hasCG:true},
  {id:"b5",no:5,division:"MB/中",name:"GENESIS",hasCG:true},
  {id:"b6",no:6,division:"MB/大",name:"Yokohama INSPIRES Drum & Bugle Corps",hasCG:true},
  {id:"b7",no:7,division:"MB/大",name:"YOKOHAMA ROBINS",hasCG:true}
];
/* 賞・部門・区分（configから読み込み） */
let PRIZE_BY_CLASS={};   // classId -> {gold,silver,bronze}
let DIVISIONS=[], CLASSES=[], AWARD_GROUPS={}, curDiv=null;
const classById=id=>CLASSES.find(c=>c.id===id);
const divName=id=>(DIVISIONS.find(d=>d.id===id)||{}).name||id;
/* 公式記録の Final（検証用の答え合わせ） */
const EXPECTED={b1:82.063,b2:85.413,b3:87.188,b4:90.663,b5:92.613,b6:94.125,b7:96.200};

/* ===================== 素点（全審査員の実データ） ===================== */
let SCORES={
  jge1:{b1:[83,84],b2:[87,88],b3:[89,89],b4:[90,92],b5:[95,94],b6:[94,94],b7:[97,98]},
  jge2:{b1:[72,71],b2:[74,75],b3:[83,82],b4:[88,89],b5:[91,91],b6:[92,93],b7:[94,95]},
  jge3:{b1:[81,78],b2:[84,82],b3:[86,84],b4:[88,87],b5:[93,92],b6:[95,93],b7:[98,97]},
  jge4:{b1:[80,79],b2:[85,83],b3:[87,86],b4:[92,91],b5:[90,92],b6:[95,94],b7:[95,97]},
  jva1:{b1:[84,83],b2:[88,88],b3:[90,91],b4:[92,92],b5:[93,93],b6:[95,96],b7:[97,98]},
  jva2:{b1:[85,84],b2:[88,88],b3:[87,88],b4:[90,91],b5:[91,91],b6:[94,94],b7:[97,96]},
  jcg1:{b1:[84,86],b2:[87,87],b3:[86,87],b4:[91,91],b5:[90,90],b6:[93,93],b7:[94,94]},
  jcg2:{b1:[87,88],b2:[89,88],b3:[89,89],b4:[92,92],b5:[91,92],b6:[95,94],b7:[95,95]},
  jma1:{b1:[82,82],b2:[86,85],b3:[87,87],b4:[90,89],b5:[92,91],b6:[93,93],b7:[96,96]},
  jma2:{b1:[82,82],b2:[85,87],b3:[86,89],b4:[92,92],b5:[93,93],b6:[95,96],b7:[97,98]},
  jmb1:{b1:[82,81],b2:[84,83],b3:[89,88],b4:[91,90],b5:[94,93],b6:[96,95],b7:[97,97]},
  jmb2:{b1:[83,82],b2:[86,84],b3:[88,87],b4:[92,89],b5:[96,94],b6:[95,96],b7:[98,97]},
  jmp1:{b1:[88,90],b2:[91,93],b3:[90,91],b4:[92,93],b5:[95,95],b6:[92,92],b7:[93,94]},
  jmp2:{b1:[85,86],b2:[91,91],b3:[86,87],b4:[93,93],b5:[98,98],b6:[95,96],b7:[97,97]}
};

/* admin編集状態（CG有無・Pen.） */
const admin={};
BANDS.forEach(b=>admin[b.id]={hasCG:b.hasCG,pen:0});

/* ===================== 採点エンジン ===================== */
const judgeByCap=cid=>JUDGES.find(j=>j.captionId===cid);
const judgeById=id=>JUDGES.find(j=>j.id===id);
function capFieldsOf(jid){const j=judgeById(jid);const c=j&&CAPTIONS.find(x=>x.id===j.captionId);return c?c.fields:null;}
function rawVals(jid,bid){
  const s=SCORES[jid]&&SCORES[jid][bid]; const f=capFieldsOf(jid); if(!s||!f)return null;
  return f.map(k=>{const x=s[k];return (x==null||x==='')?null:Number(x);});
}
function jTtl(jid,bid){
  const rv=rawVals(jid,bid); if(!rv||rv.some(v=>v==null))return null;
  return (rv[0]+rv[1])/10;                       // Ttl = (素点合計) ÷ 10
}
function familySubtotal(bandId,family,hasCG){
  let capIds;
  if(family==='Visual'){const vis=CAPTIONS.filter(c=>c.family==='Visual');capIds=(hasCG?vis:vis.filter(c=>!c.isCG)).map(c=>c.id);}
  else capIds = CAPTIONS.filter(c=>c.family===family).map(c=>c.id);
  const ttls = capIds.map(cid=>jTtl(judgeByCap(cid).id,bandId)).filter(t=>t!=null);
  if(!ttls.length) return null;
  return (ttls.reduce((a,b)=>a+b,0)/ttls.length)*FACTOR[family];   // 平均 × 係数
}
function bandResult(b){
  const hasCG=admin[b.id].hasCG, pen=admin[b.id].pen||0;
  const efc=familySubtotal(b.id,'GE',hasCG);
  const vis=familySubtotal(b.id,'Visual',hasCG);
  const mus=familySubtotal(b.id,'Music',hasCG);
  const sub=(efc||0)+(vis||0)+(mus||0);
  const final=sub-pen;
  return {band:b,hasCG,pen,efc,vis,mus,sub,final};
}
const r2=x=>x==null?null:Math.round(x*100)/100;
const r3=x=>x==null?null:Math.round(x*1000)/1000;
const f2=x=>x==null?'—':(Math.round(x*100)/100).toFixed(2);
const f3=x=>x==null?'—':(Math.round(x*1000)/1000).toFixed(3);
function rankBy(arr,getter){ // RANK.EQ（降順・同点同順位）
  return arr.map(o=>1+arr.filter(p=>getter(p)>getter(o)).length);
}
function prizeOf(band,final){
  const r=PRIZE_BY_CLASS[band&&band.classId]; if(!r||final==null) return {label:'—',cls:'none'};
  if(final>=r.gold)   return {label:'金賞',cls:'gold'};
  if(final>=r.silver) return {label:'銀賞',cls:'silver'};
  if(r.bronze!=null&&final>=r.bronze) return {label:'銅賞',cls:'bronze'};
  return {label:'—',cls:'none'};
}

const orderedCaps=fam=>CAPTIONS.filter(c=>c.family===fam);
const allOrderedCaps=()=>[...orderedCaps('GE'),...orderedCaps('Visual'),...orderedCaps('Music')];
const capById=id=>CAPTIONS.find(c=>c.id===id);
const capName=cap=>cap.name||'';
const capFieldLabels=cap=>[(cap.fields&&cap.fields[0])||'①',(cap.fields&&cap.fields[1])||'②'];
const FILL={GE:'FCEACB',Visual:'D2EAE6',Music:'DCE1F2',sub:'EFE3C6',label:'E9ECF3',final:'F2C879',rank:'F4F6FA',band:'FFFFFF',subband:'FBF6EA'};
const INK='1A2332';

function sortedResults(){
  const results=BANDS.filter(b=>b.division===curDiv).map(bandResult);
  const fr=rankBy(results,r=>r.final);
  results.forEach((r,i)=>r.finalRank=fr[i]);
  results.efcRank=rankBy(results,r=>r.efc||0);
  results.visRank=rankBy(results,r=>r.vis||0);
  results.musRank=rankBy(results,r=>r.mus||0);
  const sorted=results.slice().sort((a,b)=>a.finalRank-b.finalRank||a.band.no-b.band.no);
  return {results,sorted};
}

/* ---- CSV（1団体1行・全審査員素点＋集計） ---- */
function csvCell(v){v=(v==null?'':String(v));return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);}
function fileBase(){return 'recap_'+EVENT.name.replace(/\s+/g,'_');}
function exportMediaCSV(){
  const results=BANDS.filter(b=>b.division===curDiv).map(bandResult).sort((a,b)=>a.band.no-b.band.no);
  const num=(v,r)=>{const x=(r===3?r3(v):r2(v));return x==null?'':x.toFixed(3);};
  const lines=['team,ge,visual,music,total'];
  results.forEach(r=>{
    const team=/[",\r\n]/.test(r.band.name)?'"'+r.band.name.replace(/"/g,'""')+'"':r.band.name;
    lines.push(`${team},${num(r.efc,2)} ,${num(r.vis,2)} ,${num(r.mus,2)} ,${num(r.final,3)} `);
  });
  downloadBlob(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'}),`media_${(divName(curDiv)||'div').replace(/\s+/g,'_')}.csv`);
}
function exportCSV(){
  const {results,sorted}=sortedResults();
  const efcR=rankBy(results,r=>r.efc||0),visR=rankBy(results,r=>r.vis||0),musR=rankBy(results,r=>r.mus||0);
  const rmap={}; results.forEach((r,i)=>rmap[r.band.id]={efc:efcR[i],vis:visR[i],mus:musR[i]});
  const caps=allOrderedCaps();
  const head=['順位','登場順','部門','区分','特別表彰','団体'];
  caps.forEach(cap=>{const j=judgeByCap(cap.id);const f=capFieldLabels(cap);const jn=j?j.name:capName(cap);head.push(`${jn} ${f[0]}`,`${jn} ${f[1]}`,`${jn} Ttl`);});
  head.push('Efc','Efc順位','Vis','Vis順位','Mus','Mus順位','Sub Ttl','CG','Pen','Final','Final順位','賞');
  const rows=[head];
  sorted.forEach(r=>{
    const row=[r.finalRank,r.band.no,divName(r.band.division),(classById(r.band.classId)||{}).label||'',r.band.awardGroup||'',r.band.name];
    caps.forEach(cap=>{const j=judgeByCap(cap.id);const jid=j&&j.id;const rv=jid?rawVals(jid,r.band.id):null;const t=jid?jTtl(jid,r.band.id):null;row.push(rv&&rv[0]!=null?rv[0]:'',rv&&rv[1]!=null?rv[1]:'',t!=null?r2(t).toFixed(2):'');});
    row.push(r.efc==null?'':r2(r.efc).toFixed(2),rmap[r.band.id].efc,r.vis==null?'':r2(r.vis).toFixed(2),rmap[r.band.id].vis,r.mus==null?'':r2(r.mus).toFixed(2),rmap[r.band.id].mus,
      r3(r.sub).toFixed(3),r.hasCG?'有':'無',r.pen||0,r3(r.final).toFixed(3),r.finalRank,prizeOf(r.band,r.final).label);
    rows.push(row);
  });
  const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8;'}),fileBase()+'.csv');
}

/* ---- Excel（印刷用一般フォーマット） ---- */
function buildCols(){
  const cols=[{key:'no',head:'No',w:4},{key:'div',head:'Division',w:9},{key:'cat',head:'Category',w:8},{key:'team',head:'団体',w:30}];
  const mx=fam=>Math.round(20*(FACTOR[fam]||0));
  const addCap=(cap,fam)=>{const f=capFieldLabels(cap);
    cols.push({kind:'raw',capId:cap.id,fam,idx:0,head:f[0],w:5});
    cols.push({kind:'raw',capId:cap.id,fam,idx:1,head:f[1],w:5});
    cols.push({kind:'ttl',capId:cap.id,fam,head:'Ttl',w:6});};
  orderedCaps('GE').forEach(c=>addCap(c,'GE')); cols.push({kind:'sub',fam:'GE',sub:'efc',top:'Efc.',mid:'/'+mx('GE'),w:7});
  orderedCaps('Visual').forEach(c=>addCap(c,'Visual')); cols.push({kind:'sub',fam:'Visual',sub:'vis',top:'Vis.',mid:'/'+mx('Visual'),w:7});
  orderedCaps('Music').forEach(c=>addCap(c,'Music')); cols.push({kind:'sub',fam:'Music',sub:'mus',top:'Mus.',mid:'/'+mx('Music'),w:7});
  cols.push({kind:'subttl',head:'Sub Ttl.',w:9},{kind:'cg',head:'CG',w:5},{kind:'pen',head:'Pen.',w:6},{kind:'final',head:'Final',w:9});
  return cols;
}
const isNumericCol=col=>['raw','ttl','sub','subttl','final'].includes(col.kind);
const numFmtFor=col=>col.kind==='raw'?'0':(col.kind==='ttl'||col.kind==='sub')?'0.00':(col.kind==='subttl'||col.kind==='final')?'0.000':'General';
function valueFor(col,res){
  const b=res.band;
  switch(col.kind){
    case 'raw':{const j=judgeByCap(col.capId);const rv=j?rawVals(j.id,b.id):null;return rv?rv[col.idx]:null;}
    case 'ttl':{const j=judgeByCap(col.capId);return j?r2(jTtl(j.id,b.id)):null;}
    case 'sub':return r2(res[col.sub]);
    case 'subttl':return r3(res.sub);
    case 'cg':return res.hasCG?'有':'無';
    case 'pen':return res.pen||0;
    case 'final':return r3(res.final);
    default:
      if(col.key==='no')return b.no; if(col.key==='div')return (classById(b.classId)||{}).label||b.division;
      if(col.key==='cat')return b.awardGroup||''; if(col.key==='team')return b.name;
  }
}
function buildWorkbook(XLSX){
  const cols=buildCols(), N=cols.length;
  const {sorted}=sortedResults();
  const colRanks=cols.map(col=>{ if(!isNumericCol(col))return null;
    const vals=sorted.map(r=>valueFor(col,r));
    return vals.map(v=>v==null?null:1+vals.filter(o=>o!=null&&o>v).length); });
  const data=[]; const merges=[];
  const h0=new Array(N).fill(''),h1=new Array(N).fill(''),h2=new Array(N).fill('');
  h0[0]='No';h0[1]='Division';h0[2]='Category';h0[3]='団体';
  cols.forEach((col,c)=>{
    if(col.kind==='raw'&&col.idx===0){const cap=capById(col.capId);const j=judgeByCap(col.capId);h0[c]=cap?capName(cap):'';h1[c]=j?j.name:'';}
    if(col.kind==='raw')h2[c]=col.head;
    if(col.kind==='ttl')h2[c]='Ttl';
    if(col.kind==='sub'){h0[c]=col.top;h1[c]=col.mid;h2[c]='Ttl';}
    if(['subttl','cg','pen','final'].includes(col.kind))h0[c]=col.head;
  });
  data.push(h0,h1,h2);
  for(let c=0;c<4;c++)merges.push({s:{r:0,c},e:{r:2,c}});
  cols.forEach((col,c)=>{ if(col.kind==='raw'&&col.idx===0){merges.push({s:{r:0,c},e:{r:0,c:c+2}});merges.push({s:{r:1,c},e:{r:1,c:c+2}});} });
  cols.forEach((col,c)=>{ if(col.kind==='sub')merges.push({s:{r:0,c},e:{r:1,c}}); });
  cols.forEach((col,c)=>{ if(['subttl','cg','pen','final'].includes(col.kind))merges.push({s:{r:0,c},e:{r:2,c}}); });
  let R=3;
  sorted.forEach((res,ri)=>{
    const rowA=new Array(N).fill(''),rowB=new Array(N).fill('');
    cols.forEach((col,c)=>{
      const v=valueFor(col,res);
      if(['no','div','cat','team'].includes(col.key)){rowA[c]=v;}
      else{ rowA[c]=(v==null?'':v);
        if(isNumericCol(col)){const rk=colRanks[c]?colRanks[c][ri]:null;rowB[c]=(rk==null?'':rk);} }
    });
    data.push(rowA,rowB);
    for(let c=0;c<4;c++)merges.push({s:{r:R,c},e:{r:R+1,c}});
    R+=2;
  });
  const maxRow=new Array(N).fill(''); cols.forEach((col,c)=>{if(col.kind==='sub')maxRow[c]=col.mid;}); data.push(maxRow);

  const ws=XLSX.utils.aoa_to_sheet(data);
  const border={top:{style:'thin',color:{rgb:'C8CEDC'}},bottom:{style:'thin',color:{rgb:'C8CEDC'}},left:{style:'thin',color:{rgb:'C8CEDC'}},right:{style:'thin',color:{rgb:'C8CEDC'}}};
  const set=(r,c,s,z)=>{const a=XLSX.utils.encode_cell({r,c});if(!ws[a])ws[a]={t:'s',v:''};ws[a].s=s;if(z&&z!=='General')ws[a].z=z;};
  const headFill=col=>col.fam?FILL[col.fam]:(col.kind==='final'?FILL.final:FILL.label);
  for(let hr=0;hr<3;hr++)cols.forEach((col,c)=>{
    let fill=c<4?FILL.label:headFill(col); if(col.kind==='sub')fill=FILL.sub;
    set(hr,c,{fill:{fgColor:{rgb:fill}},font:{bold:true,sz:8,color:{rgb:INK},name:'Arial'},alignment:{horizontal:'center',vertical:'center',wrapText:true},border});
  });
  R=3;
  sorted.forEach(()=>{ cols.forEach((col,c)=>{
    let bf=FILL.band; if(col.kind==='final')bf=FILL.final; else if(col.kind==='sub')bf=FILL.subband;
    const bold=['sub','subttl','final'].includes(col.kind);
    set(R,c,{fill:{fgColor:{rgb:bf}},font:{bold,sz:9,color:{rgb:INK},name:'Arial'},alignment:{horizontal:c===3?'left':'center',vertical:'center',wrapText:c===3},border},isNumericCol(col)?numFmtFor(col):null);
    set(R+1,c,{fill:{fgColor:{rgb:FILL.rank}},font:{sz:7,italic:true,color:{rgb:'7A8499'},name:'Arial'},alignment:{horizontal:'center',vertical:'center'},border});
  }); R+=2; });
  cols.forEach((col,c)=>set(R,c,{fill:{fgColor:{rgb:'FFFFFF'}},font:{sz:8,italic:true,color:{rgb:'9AA3B5'}},alignment:{horizontal:'center'},border}));

  ws['!cols']=cols.map(col=>({wch:col.w}));
  ws['!merges']=merges;
  ws['!freeze']={xSplit:4,ySplit:3};
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'印刷用_一般');
  return wb;
}

let _ejsP=null;
function ensureExcelJS(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  if(_ejsP)return _ejsP;
  _ejsP=loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js').then(()=>window.ExcelJS);
  return _ejsP;
}
/* ---- 印刷用データ準備（選択中の部門） ---- */
function prepRecapData(){
  const FAMLABEL={GE:'General Effect',Visual:'Visual',Music:'Music'};
  const fams=['GE','Visual','Music'].map(key=>{
    const caps=CAPTIONS.filter(c=>c.family===key).map(cap=>{const j=judgeByCap(cap.id);const fl=capFieldLabels(cap);return {group:cap.name,judge:j?j.name:'',f1:fl[0]+'.',f2:fl[1]+'.',id:cap.id};});
    const factor=FACTOR[key]||0;
    return {key,label:FAMLABEL[key],factor,max:Math.round(20*factor),caps};
  }).filter(f=>f.caps.length);
  const flat=[].concat(...fams.map(f=>f.caps));
  const results=BANDS.filter(b=>b.division===curDiv).map(bandResult).sort((a,b)=>a.band.no-b.band.no);
  const bands=results.map(r=>{
    const caps=flat.map(cap=>{const j=judgeByCap(cap.id);const rv=j?rawVals(j.id,r.band.id):null;const t=j?jTtl(j.id,r.band.id):null;return {v1:rv?rv[0]:null,v2:rv?rv[1]:null,ttl:t};});
    return {no:r.band.no,divShort:r.band.awardGroup||'',className:(classById(r.band.classId)||{}).label||'',awardGroup:r.band.awardGroup||'',name:r.band.name,hasCG:r.hasCG,pen:r.pen,caps,efc:r.efc,vis:r.vis,mus:r.mus,subttl:r.sub,final:r.final,prize:prizeOf(r.band,r.final).label};
  });
  const judges=fams.map(f=>({label:f.label+'｜',names:f.caps.map(c=>c.judge).filter(Boolean).join(' / ')}));
  const subLines=(EVENT.subLines&&EVENT.subLines.length)?EVENT.subLines:['■主催｜マーチング祭 ALL JAPAN CHAMPIONSHIPS 実行委員会'];
  return {eventName:EVENT.name||'',subLines,divisionLabel:divName(curDiv),families:fams,bands,manualAwards:(MANUAL_AWARDS||[]).filter(a=>a.name||a.recipient),judges,logos:LOGOS};
}

/* ===== Faithful recap builder (ExcelJS) — testable module ===== */
// D = {eventName, subLines[], divisionLabel, families[{key,label,factor,max,caps:[{group,judge,f1,f2}]}],
//      bands[{no,divShort,className,awardGroup,name,hasCG,pen,caps:[{v1,v2,ttl}],efc,vis,mus,subttl,final,prize}],
//      manualAwards[{name,recipient}], judges[{label,names}], logos{grab:{b64,w,h},marching:{b64,w,h}}}
function buildRecap(ExcelJS, D){
  const GREY='FFB9BCC2', LIGHT='FFF6F8FC', INK='FF1A2332', LINE='FFC8CEDC';
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet(D.divisionLabel||'Recap',{views:[{state:'frozen',xSplit:7,ySplit:8}]});
  const thin={style:'thin',color:{argb:LINE}};
  const border={top:thin,bottom:thin,left:thin,right:thin};
  const roboto=(o={})=>Object.assign({name:'Roboto',size:9,color:{argb:INK}},o);
  const fillOf=argb=>({type:'pattern',pattern:'solid',fgColor:{argb}});
  const set=(r,c,val,opt={})=>{const cell=ws.getRow(r).getCell(c);cell.value=val;
    if(opt.font)cell.font=opt.font; if(opt.fill)cell.fill=opt.fill;
    cell.alignment=Object.assign({vertical:'middle',horizontal:'center',wrapText:!!opt.wrap},opt.align||{});
    if(opt.border!==false)cell.border=border; if(opt.numFmt)cell.numFmt=opt.numFmt; return cell;};

  /* ---- column layout ---- */
  const MARGIN=3;                     // A,B,C
  let cols=[];                        // {c,kind,gi,field,header,width}
  cols.push({c:4,key:'no',width:3});
  cols.push({c:5,key:'div',width:7});
  cols.push({c:6,key:'cls',width:9});
  cols.push({c:7,key:'team',width:27});
  let c=8; let gi=0;                  // global cap index
  const famSpans=[];
  D.families.forEach(fam=>{
    const start=c;
    fam.caps.forEach(cap=>{
      cols.push({c:c++,kind:'f1',gi,cap,width:4.5});
      cols.push({c:c++,kind:'f2',gi,cap,width:4.5});
      cols.push({c:c++,kind:'ttl',gi,cap,width:7.3});
      gi++;
    });
    const subC=c++; cols.push({c:subC,kind:'sub',fam,width:7.3});
    famSpans.push({fam,start,end:subC-1,subC});
  });
  const tail=['subttl','cg','pen','final','prize'];
  const tailLabel={subttl:'Sub Ttl.',cg:'CG',pen:'Pen.',final:'Final',prize:'Prize'};
  const tailW={subttl:8.8,cg:6.3,pen:5.7,final:9.2,prize:6.5};
  const tailC={};
  tail.forEach(k=>{tailC[k]=c;cols.push({c:c++,kind:'tail',tk:k,width:tailW[k]});});
  const LAST=c-1;

  // widths
  for(let i=1;i<=MARGIN;i++) ws.getColumn(i).width=2.2;
  cols.forEach(col=>ws.getColumn(col.c).width=col.width);

  /* ---- row heights ---- */
  [1,2,3,4].forEach(r=>ws.getRow(r).height=32);
  [5,6,7,8].forEach(r=>ws.getRow(r).height=49);

  /* ---- title banner D1:LAST 1-4 ---- */
  ws.mergeCells(1,4,4,LAST);
  const tcell=ws.getRow(1).getCell(4);
  tcell.value={richText:[
    {font:{name:'Meiryo',size:22,bold:true,color:{argb:INK}},text:(D.eventName||'')+'\n'},
    ...(D.subLines||[]).map(t=>({font:{name:'Meiryo',size:9,color:{argb:INK}},text:t+'\n'}))
  ]};
  tcell.alignment={vertical:'middle',horizontal:'left',wrapText:true};

  /* ---- dept box D5:G8 ---- */
  ws.mergeCells(5,4,8,7);
  const dcell=ws.getRow(5).getCell(4);
  dcell.value={richText:[{font:{name:'Roboto',size:18,bold:true,color:{argb:INK}},text:(D.divisionLabel||'')+'\n決勝'}]};
  dcell.alignment={vertical:'middle',horizontal:'center',wrapText:true};
  dcell.border=border;

  /* ---- header rows 5-8 ---- */
  famSpans.forEach(fs=>{
    // row5 family label across caps + subtotal
    ws.mergeCells(5,fs.start,5,fs.subC);
    set(5,fs.start,fs.fam.label,{font:roboto({bold:true,size:11}),fill:fillOf(GREY)});
    // subtotal col rows6-8
    ws.mergeCells(6,fs.subC,7,fs.subC);
    set(6,fs.subC,{'GE':'Efc.','Visual':'Vis.','Music':'Mus.'}[fs.fam.key]||'',{font:roboto({bold:true}),fill:fillOf(GREY)});
    set(8,fs.subC,'Ttl.',{font:roboto({bold:true}),fill:fillOf(GREY)});
  });
  cols.forEach(col=>{
    if(col.kind==='f1'||col.kind==='f2'||col.kind==='ttl'){
      const cap=col.cap;
      if(col.kind==='f1'){ // group row6 + judge row7 merged across 3 cols
        ws.mergeCells(6,col.c,6,col.c+2); set(6,col.c,cap.group,{font:roboto({bold:true}),fill:fillOf(LIGHT),wrap:true});
        ws.mergeCells(7,col.c,7,col.c+2); set(7,col.c,cap.judge,{font:roboto({bold:true}),fill:fillOf(LIGHT),wrap:true});
      }
      const lbl=col.kind==='f1'?cap.f1:col.kind==='f2'?cap.f2:'Ttl.';
      set(8,col.c,lbl,{font:roboto({bold:true}),fill:col.kind==='ttl'?fillOf(LIGHT):undefined});
    }
  });
  // tail headers rows5-8 vertical merge
  tail.forEach(k=>{ws.mergeCells(5,tailC[k],8,tailC[k]);set(5,tailC[k],tailLabel[k],{font:roboto({bold:true}),fill:fillOf(GREY),wrap:true});});

  /* ---- per-column ranks ---- */
  const numCols=cols.filter(col=>['f1','f2','ttl','sub'].includes(col.kind)||(col.kind==='tail'&&(col.tk==='subttl'||col.tk==='final')));
  const valOf=(band,col)=>{
    if(col.kind==='f1')return band.caps[col.gi].v1;
    if(col.kind==='f2')return band.caps[col.gi].v2;
    if(col.kind==='ttl')return band.caps[col.gi].ttl;
    if(col.kind==='sub')return band[{'GE':'efc','Visual':'vis','Music':'mus'}[col.fam.key]];
    if(col.kind==='tail'&&col.tk==='subttl')return band.subttl;
    if(col.kind==='tail'&&col.tk==='final')return band.final;
    return null;
  };
  const rankMap=new Map();
  numCols.forEach(col=>{
    const vals=D.bands.map(b=>valOf(b,col));
    const ranks=vals.map(v=>v==null?null:1+vals.filter(o=>o!=null&&o>v).length);
    rankMap.set(col.c,ranks);
  });

  /* ---- data rows (2 per band) ---- */
  let R=9;
  D.bands.forEach((b,bi)=>{
    ws.getRow(R).height=50; ws.getRow(R+1).height=50;
    // left block merged over 2 rows
    ws.mergeCells(R,4,R+1,4); set(R,4,b.no,{font:roboto({bold:true})});
    ws.mergeCells(R,5,R+1,5); set(R,5,b.divShort,{font:roboto()});
    ws.mergeCells(R,6,R+1,6); set(R,6,b.className,{font:roboto({size:8}),wrap:true});
    ws.mergeCells(R,7,R+1,7); set(R,7,b.name,{font:roboto({bold:true,size:10}),align:{horizontal:'left'},wrap:true});
    cols.forEach(col=>{
      if(['no','div','cls','team'].includes(col.key))return;
      const v=valOf(b,col);
      const isTtlish=col.kind==='ttl'||col.kind==='sub'||(col.kind==='tail'&&(col.tk==='subttl'||col.tk==='final'));
      const fill=(col.kind==='ttl'||col.kind==='sub')?fillOf(LIGHT):(col.kind==='tail'&&col.tk==='final'?fillOf(GREY):undefined);
      const bold=isTtlish;
      let disp='';
      if(col.kind==='f1'||col.kind==='f2')disp=(v==null?'':v);
      else if(col.kind==='ttl'||col.kind==='sub')disp=(v==null?'':Number(v).toFixed(2));
      else if(col.kind==='tail'){
        if(col.tk==='subttl')disp=(b.subttl==null?'':Number(b.subttl).toFixed(3));
        else if(col.tk==='final')disp=(b.final==null?'':Number(b.final).toFixed(3));
        else if(col.tk==='cg')disp=b.hasCG?'有':'無';
        else if(col.tk==='pen')disp=b.pen||0;
        else if(col.tk==='prize')disp=b.prize||'';
      }
      set(R,col.c,disp,{font:roboto({bold}),fill});
      // rank row
      const ranks=rankMap.get(col.c);
      const rk=ranks?ranks[bi]:null;
      set(R+1,col.c,(rk==null?'':rk),{font:roboto({size:7,italic:true,color:{argb:'FF7A8499'}}),fill:fillOf('FFF9FAFC')});
    });
    R+=2;
  });

  /* ---- max row ---- */
  ws.getRow(R).height=20;
  famSpans.forEach(fs=>set(R,fs.subC,'/'+fs.fam.max,{font:roboto({size:8,italic:true,color:{argb:'FF9AA3B5'}}),border:false}));
  R+=2;

  /* ---- footer: special awards ---- */
  const fRow=R;
  set(fRow,4,'特別賞',{font:roboto({bold:true,size:11}),border:false,align:{horizontal:'left'}});
  ws.getRow(fRow).height=22;
  (D.manualAwards||[]).forEach((a,i)=>{
    const rr=fRow+1+i; ws.getRow(rr).height=20;
    ws.mergeCells(rr,4,rr,6); set(rr,4,a.name,{font:roboto({bold:true}),border:false,align:{horizontal:'left'}});
    ws.mergeCells(rr,7,rr,14); set(rr,7,a.recipient,{font:roboto(),border:false,align:{horizontal:'left'}});
  });
  let jr=fRow+2+(D.manualAwards||[]).length;
  set(jr,4,'Judges',{font:roboto({bold:true,size:11}),border:false,align:{horizontal:'left'}});
  (D.judges||[]).forEach((g,i)=>{
    const rr=jr+1+i; ws.getRow(rr).height=18;
    ws.mergeCells(rr,4,rr,6); set(rr,4,g.label,{font:roboto({bold:true,size:8}),border:false,align:{horizontal:'left'}});
    ws.mergeCells(rr,7,rr,20); set(rr,7,g.names,{font:roboto({size:8}),border:false,align:{horizontal:'left'}});
  });

  /* ---- logos ---- */
  if(D.logos&&D.logos.grab){
    const id=wb.addImage({base64:D.logos.grab.b64,extension:'png'});
    ws.addImage(id,{tl:{col:LAST-6,row:fRow-0.5},ext:{width:120,height:108}});
  }
  if(D.logos&&D.logos.marching){
    const id=wb.addImage({base64:D.logos.marching.b64,extension:'png'});
    ws.addImage(id,{tl:{col:LAST-6,row:fRow+3.2},ext:{width:150,height:62}});
  }

  ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.2,right:0.2,top:0.2,bottom:0.2,header:0,footer:0}};
  return wb;
}

function exportXLSX(){
  const btn=wrap.querySelector('#exp-xlsx'); if(!btn)return; const old=btn.innerHTML; btn.textContent='生成中…';
  ensureExcelJS().then(async ExcelJS=>{
    const wb=buildRecap(ExcelJS,prepRecapData());
    const buf=await wb.xlsx.writeBuffer();
    downloadBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fileBase()+'_'+((divName(curDiv)||'div').replace(/\s+/g,'_'))+'.xlsx');
    btn.innerHTML=old;
  }).catch(e=>{btn.innerHTML=old;alert('Excel生成に失敗しました: '+(e.message||e));});
}


async function fetchScores(){
  try{
    const res=await fetch(scoresURL); if(!res.ok)throw new Error('HTTP '+res.status);
    SCORES=(await res.json())||{}; liveOK=true; lastFetch=Date.now();
  }catch(e){ liveOK=false; }
  try{ const c=await (await fetch(confirmURL)).json(); CONFIRM=(c&&c.state)?c:{state:'none',hash:null,at:null}; }catch(e){}
  if(CONFIRM.state==='confirmed' && scoreHash(SCORES)!==CONFIRM.hash){   // 確定後に修正 → 自動で確定解除
    CONFIRM={state:'stale',hash:CONFIRM.hash,at:CONFIRM.at}; putConfirm();
  }
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest('.mawards'))return;
  try{ render(); }catch(e){ console.error('render error:',e); }
}
async function saveManual(){
  const btn=wrap.querySelector('#msave'); if(!btn)return; btn.textContent='保存中…';
  try{
    const res=await fetch(manualURL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(MANUAL_AWARDS.filter(a=>a.name||a.recipient))});
    btn.textContent=res.ok?'✓ 保存しました':'✗ 失敗';
  }catch(e){ btn.textContent='✗ 通信エラー'; }
  setTimeout(()=>{const b=wrap.querySelector('#msave');if(b)b.textContent='保存';},1600);
}
async function boot(){
  wrap.innerHTML='<div style="padding:64px 22px;text-align:center;color:#8b96ad;font-family:var(--body)">設定を読み込み中…</div>';
  try{
    const res=await fetch(cfgURL); if(!res.ok)throw new Error('HTTP '+res.status);
    const cfg=await res.json(); if(!cfg||!cfg.captions)throw new Error('config empty');
    EVENT=cfg.event||EVENT; CAPTIONS=cfg.captions; JUDGES=cfg.judges; BANDS=cfg.bands;
    if(cfg.families){['GE','Visual','Music'].forEach(f=>{if(cfg.families[f]&&cfg.families[f].factor!=null)FACTOR[f]=Number(cfg.families[f].factor);});}
    DIVISIONS=(cfg.divisions&&cfg.divisions.length)?cfg.divisions:[{id:'mb',name:'MB部門'}];
    CLASSES=cfg.classes||[]; AWARD_GROUPS=cfg.awardGroups||{};
    PRIZE_BY_CLASS={}; (cfg.prizeRules||[]).forEach(r=>{if(r.classId)PRIZE_BY_CLASS[r.classId]={gold:r.gold,silver:r.silver,bronze:r.bronze};});
    curDiv=(DIVISIONS[0]||{}).id||null;
    Object.keys(admin).forEach(k=>delete admin[k]); BANDS.forEach(b=>admin[b.id]={hasCG:b.hasCG,pen:0});
    try{const ma=await (await fetch(manualURL)).json();MANUAL_AWARDS=Array.isArray(ma)?ma:[];}catch(e){MANUAL_AWARDS=[];}
    await fetchScores();
    setInterval(fetchScores,5000);
  }catch(e){
    wrap.innerHTML='<div style="padding:52px 24px;text-align:center;color:#e8705a;font-family:var(--body);line-height:1.8">設定を読み込めませんでした。<br>setup.html で設定をアップロード済みか、ネット接続を確認してください。<br><small style="color:#8b96ad">'+(e.message||e)+'</small></div>';
  }
}
boot();
</script>
