<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>審査員入力 — Marching Matsuri Judge</title>
<style>
  .mm-logo{height:22px;width:auto;max-width:72%;opacity:.95;}
  .logobar{display:flex;justify-content:center;align-items:center;padding:10px 0 6px;flex:0 0 auto;}
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@600;700&family=Inter:wght@400;500;600&display=swap');
  :root{
    --field:#0a0a0c;--panel:#17151a;--panel-2:#211d24;--line:#332e38;--ink:#ffffff;--muted:#9a929b;
    --gold:#BC002D;--gold-dim:#7d0020;--signal:#BC002D;--danger:#f5a623;--green:#BC002D;--onpink:#ffffff;
    --display:'Oswald','Arial Narrow',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{height:100%;touch-action:manipulation;}
  .app{touch-action:manipulation;}
  .key,.navbtn,.tab,.divtab,.fbox,.jb,.ghost,.decidebtn,.rtoggle button{touch-action:manipulation;}
  body{background:var(--field);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  .app{max-width:460px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    padding-top:env(safe-area-inset-top,0);padding-bottom:calc(env(safe-area-inset-bottom,0) + 15px);}
  /* 全画面共通の著作権表記（マーチング祭） */
  .copyr{position:fixed;left:0;right:0;bottom:0;text-align:center;font:500 9px var(--body);letter-spacing:.09em;color:var(--muted);opacity:.6;padding:3px 0 calc(env(safe-area-inset-bottom,0) + 2px);pointer-events:none;z-index:50;}

  /* top */
  .top{flex:0 0 auto;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .top .who{flex:1;min-width:0;}
  .top .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top .cap{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);}
  .pill{font-size:10px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid;white-space:nowrap;}
  .pill.ok{color:var(--muted);border-color:var(--line);}
  .pill.wait{color:var(--gold);border-color:var(--gold-dim);}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:11px;border-radius:8px;padding:6px 9px;cursor:pointer;font-family:var(--body);}

  /* division tabs */
  .divtabs{flex:0 0 auto;display:flex;gap:6px;padding:8px 14px 0;}
  .divtab{flex:1;padding:8px;border-radius:9px 9px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--panel);color:var(--muted);font-family:var(--display);font-weight:600;font-size:12px;cursor:pointer;}
  .divtab.active{background:var(--gold);color:var(--onpink);border-color:var(--gold);}

  /* main tabs */
  .tabs{flex:0 0 auto;display:flex;border-bottom:1px solid var(--line);}
  .tab{flex:1;padding:12px 4px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.06em;cursor:pointer;}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold);}

  .body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* select screen */
  .sel{padding:20px 16px 40px;}
  .sel .logobar{padding:34px 0 22px;}
  .sel .mm-logo{height:40px;max-width:82%;}
  .sel h1{font-family:var(--display);font-weight:600;font-size:22px;margin-bottom:4px;text-align:center;}
  .sel p{color:var(--muted);font-size:13px;margin-bottom:18px;text-align:center;}
  .famlabel{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--ink);display:flex;align-items:center;gap:9px;margin:16px 0 9px;}
  .famlabel::after{content:"";flex:1;height:1px;background:var(--line);}
  .jb{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:8px;color:var(--ink);text-align:left;cursor:pointer;font-family:var(--body);}
  .jb .n{font-size:16px;font-weight:600;}
  .jb .c{font-size:11px;color:var(--muted);margin-top:2px;}
  .jb .chev{color:var(--gold);font-size:20px;}

  /* PIN screen */
  .pin{display:flex;flex-direction:column;height:100%;padding:24px 22px 26px;}
  .pin .back{align-self:flex-start;background:transparent;border:1px solid var(--line);color:var(--muted);font-size:12px;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:var(--body);}
  .pin .phead{text-align:center;margin:18px 0 4px;}
  .pin .pn{font-family:var(--display);font-weight:600;font-size:22px;}
  .pin .pc{font-size:12px;color:var(--muted);margin-top:3px;}
  .pin .ptip{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 10px;}
  .pindots{display:flex;gap:14px;justify-content:center;margin:6px 0 4px;}
  .pindot{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);}
  .pindot.on{background:var(--gold);border-color:var(--gold);}
  .pinerr{text-align:center;color:var(--danger);font-size:12.5px;font-weight:600;height:18px;margin-top:8px;}
  .pin .shake{animation:shk .3s;}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .pinpad{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:18px auto 0;width:100%;}
  .pinkey{height:58px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;font-family:var(--mono);font-weight:700;font-size:24px;cursor:pointer;user-select:none;}
  .pinkey:active{background:var(--panel-2);border-color:var(--gold-dim);}
  .pinkey.util{font-family:var(--display);font-size:16px;color:var(--muted);}
  .pinkey.blank{border:0;background:transparent;cursor:default;}

  /* criteria tab */
  .crit{padding:18px 18px 40px;}
  .crit .band{font-family:var(--display);font-weight:600;font-size:18px;margin-bottom:12px;}
  .crit .item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--panel);}
  .crit .item h3{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.05em;}
  .crit .item p{color:var(--muted);font-size:12.5px;margin-top:5px;line-height:1.5;}
  .crit .note{color:var(--muted);font-size:12px;line-height:1.7;margin-top:6px;}
  .crit .note code{font-family:var(--mono);color:var(--ink);background:var(--panel);padding:1px 6px;border-radius:5px;}

  /* input tab — fits one screen, no scroll */
  .inp{display:flex;flex-direction:column;min-height:100%;}
  .inpmid{flex:0 0 auto;}
  .bandbar{flex:0 0 auto;padding:7px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .bandbar .bn{min-width:0;}
  .bandbar .no{font-family:var(--mono);font-size:10px;color:var(--gold);}
  .bandbar .tm{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bandbar .meta{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--display);}
  .navbtn{width:36px;height:36px;flex:0 0 36px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;font-size:17px;cursor:pointer;}
  .navbtn[disabled]{opacity:.3;}

  .fields{flex:0 0 auto;display:flex;gap:8px;padding:8px 14px 4px;}
  .fbox{flex:1;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:5px 6px;text-align:center;cursor:pointer;}
  .fbox.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(188,0,45,.20);}
  .fbox .fl{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .fbox .fv{font-family:var(--mono);font-weight:700;font-size:clamp(22px,6.2vw,30px);line-height:1.05;}
  .fbox.active .fv{color:var(--gold);}
  .fbox .fv.empty{color:var(--line);}
  .fbox .boxtag{margin-top:3px;display:inline-block;font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.03em;padding:1px 9px;border-radius:5px;color:#fff;line-height:1.5;}
  .boxtag.b1{background:rgba(188,0,45,.22);color:#edc2cb;}
  .boxtag.b2{background:rgba(188,0,45,.40);}
  .boxtag.b3{background:rgba(188,0,45,.58);}
  .boxtag.b4{background:rgba(188,0,45,.80);}
  .boxtag.b5{background:#BC002D;box-shadow:0 0 0 1px rgba(255,120,150,.5);}
  .boxtag.empty{background:transparent;color:var(--line);font-weight:600;}
  .ttlbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:9px;padding:3px 14px;}
  .ttlbar .lab{font-family:var(--display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .ttlbar .val{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--signal);}
  .ttlbar .rk{font-family:var(--display);font-size:10px;color:var(--gold);letter-spacing:.05em;}

  .cglock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--muted);}
  .cglock .big{font-family:var(--display);font-weight:600;font-size:20px;color:var(--danger);margin-bottom:8px;}

  .cmt{flex:0 0 auto;padding:2px 14px 4px;}
  .cmt input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:var(--body);font-size:13px;padding:7px 11px;outline:none;}
  .cmt input:focus{border-color:var(--gold);}

  .keypad{flex:0 0 auto;margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:54px;gap:6px;padding:6px 14px 10px;}
  .key{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;font-family:var(--mono);font-weight:700;font-size:clamp(18px,5.2vw,23px);cursor:pointer;user-select:none;}
  .key:active{background:var(--panel-2);border-color:var(--gold-dim);}
  .key.util{font-family:var(--display);font-size:clamp(12px,3.6vw,15px);color:var(--muted);letter-spacing:.03em;}
  /* 画面が低い端末ではスコア欄とテンキーが同時に収まるようコンパクト化 */
  @media (max-height:720px){
    .keypad{grid-auto-rows:48px;gap:5px;padding:5px 12px 8px;}
    .fbox{padding:4px 6px;}
    .fbox .fv{font-size:24px;}
    .fbox .boxtag{margin-top:2px;}
    .bandbar{padding:5px 12px;}
    .ttlbar{padding:2px 12px;}
    .cmt{padding:1px 12px 3px;}
    .cmt input{padding:5px 10px;font-size:12.5px;}
  }
  @media (max-height:600px){
    .keypad{grid-auto-rows:44px;}
    .fbox .fv{font-size:21px;}
    .fbox .fl{font-size:10px;}
  }

  /* ranking tab */
  .rank{padding:10px 0 30px;}
  .rtoggle{display:flex;gap:6px;padding:10px 16px;}
  .rtoggle button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--display);font-weight:600;font-size:12px;cursor:pointer;}
  .rtoggle button.active{background:var(--gold);color:var(--onpink);border-color:var(--gold);}
  .rtoggle button[disabled]{opacity:.4;}
  .st-warn{display:flex;align-items:center;gap:8px;margin:6px 14px;padding:8px 11px;border:1px solid var(--danger);background:rgba(245,166,35,.12);border-radius:9px;color:var(--danger);font-size:11.5px;font-weight:600;}
  .st-head,.st-row{display:grid;grid-template-columns:40px 1fr 42px 42px 52px;align-items:center;gap:8px;padding:9px 14px;}
  .st-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);z-index:2;}
  .st-head span{text-align:center;} .st-head .hn{text-align:left;}
  .st-row{border-left:3px solid transparent;}
  .st-row.cur{background:rgba(188,0,45,.10);border-left-color:var(--gold);}
  .st-row.tie{background:rgba(245,166,35,.12);border-left-color:var(--danger);}
  .st-row.empty{opacity:.5;}
  .st-rk{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--signal);text-align:center;line-height:1;}
  .st-rk .u{font-family:var(--body);font-weight:600;font-size:10px;color:var(--muted);margin-left:1px;}
  .st-row.cur .st-rk{color:var(--gold);} .st-row.tie .st-rk{color:var(--danger);}
  .st-nm{min-width:0;} .st-nm .no{font-family:var(--mono);font-size:10px;color:var(--muted);margin-right:6px;}
  .st-nm .bn{font-size:13px;font-weight:500;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.2;}
  .st-sub{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center;}
  .st-ttl{font-family:var(--mono);font-weight:700;font-size:15px;text-align:center;}
  .st-row.empty .st-sub,.st-row.empty .st-ttl{color:var(--line);}
  /* final recap: GE / VIS / MUS / FINAL columns */
  .rank.final .st-head,.rank.final .st-row{grid-template-columns:34px 1fr 38px 38px 38px 50px;gap:5px;padding:9px 10px;align-items:center;}
  .rank.final .st-sub{font-size:10.5px;letter-spacing:-.02em;}
  .rank.final .st-ttl{font-size:12.5px;}
  .rank.final .st-rk{font-size:15px;}
  .rank.final .st-nm .bn{font-size:11.5px;}
  .rank.final .st-row.exp{cursor:pointer;}
  .rank.final .st-row.open{background:rgba(188,0,45,.06);}
  .st-chev{grid-column:1 / -1;text-align:center;color:var(--muted);font-size:9px;margin-top:-4px;}
  /* per-judge breakdown (expanded) */
  .jd{background:#100e12;border-top:1px dashed var(--line);border-bottom:1px solid var(--line);padding:6px 14px 12px;}
  .jd-fam{font-family:var(--display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:9px 0 3px;border-bottom:1px solid var(--line);padding-bottom:3px;}
  .jd-row{display:grid;grid-template-columns:1fr 52px 44px;gap:8px;align-items:center;padding:4px 4px;border-radius:6px;}
  .jd-row .jn{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .jd-row .jt{font-family:var(--mono);font-size:13px;text-align:center;color:var(--ink);}
  .jd-row .jr{font-family:var(--mono);font-size:11px;text-align:center;color:var(--muted);}
  .jd-row.me{background:rgba(188,0,45,.26);box-shadow:inset 3px 0 0 var(--gold);}
  .jd-row.me .jn{color:#fff;font-weight:700;} .jd-row.me .jt{color:#fff;font-weight:700;}
  .rinfo{color:var(--muted);font-size:12px;padding:10px 16px;line-height:1.6;}
  /* final-confirm bar */
  .fconfirm{padding:12px 16px 8px;}
  .fcbtn{width:100%;padding:13px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:var(--onpink);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
  .fcbtn.done{background:rgba(188,0,45,.14);color:#ff6b86;}
  .fcbtn:active{transform:scale(.99);}
  .fcnote{text-align:center;font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5;}

  /* decide bar */
  .decide{flex:0 0 auto;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel);}
  .decidebtn{width:100%;padding:14px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:var(--onpink);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
  .decidebtn.done{background:rgba(188,0,45,.14);color:#ff6b86;border-color:var(--gold);}
  .decidebtn:active{transform:scale(.99);}
  .decidenote{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;}

  /* criteria dropdown */
  .crit .cap-sub{color:var(--muted);font-size:12px;margin:-6px 0 14px;line-height:1.5;}
  .crit .acc{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--panel);overflow:hidden;}
  .crit .acc-head{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer;user-select:none;}
  .crit .acc-badge{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--onpink);background:var(--gold);border-radius:7px;min-width:30px;height:26px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .crit .acc-tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .crit .acc-tt .t1{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;line-height:1.1;}
  .crit .acc-tt .t2{font-family:var(--display);font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);line-height:1.15;}
  .crit .acc-cv{color:var(--muted);font-size:13px;transition:transform .18s;flex:0 0 auto;}
  .crit .acc.open .acc-cv{transform:rotate(180deg);}
  .crit .acc-body{display:none;border-top:1px solid var(--line);padding:6px 15px 12px;}
  .crit .acc.open .acc-body{display:block;}
  .crit .ci{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.04);}
  .crit .ci:last-child{border-bottom:0;}
  .crit .ci .num{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--gold);flex:0 0 auto;min-width:22px;}
  .crit .ci .tx{font-size:12.5px;line-height:1.5;color:var(--ink);}
  .crit .ci .tx b{font-weight:600;}
  .crit .hint{color:var(--muted);font-size:11px;text-align:center;margin-top:4px;}

  /* lock / edit-request */
  .lockstatus{text-align:center;font-family:var(--display);font-weight:600;font-size:13px;color:#ff6b86;margin-bottom:8px;letter-spacing:.03em;}
  .lockrow{display:flex;flex-direction:column;gap:8px;}
  .lockmsg{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5;}
  .reqbtn{width:100%;padding:12px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:var(--onpink);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer;}
  .reqbtn.cancel{background:transparent;color:var(--muted);border-color:var(--line);font-weight:600;}
  .reqbtn:active{transform:scale(.99);}
  .lockpanel{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px 24px;text-align:center;color:var(--muted);}
  .lockpanel .lk{font-size:30px;}
  .lockpanel .big{font-family:var(--display);font-weight:600;font-size:17px;color:#ff6b86;}
  .lockpanel .sm{font-size:12px;line-height:1.6;}
  .fbox.ro{opacity:.9;cursor:default;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}

  /* --- 起動スプラッシュ --- */
  #mmsplash{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 42%,#1a0d10 0%,#0a0a0c 60%);
    animation:mmSplashOut .6s ease 2.4s forwards;}
  #mmsplash img{width:min(82vw,380px);height:auto;opacity:0;transform:scale(.9);filter:drop-shadow(0 6px 24px rgba(188,0,45,.35));
    animation:mmLogoIn .75s cubic-bezier(.2,.8,.2,1) .08s forwards;}
  #mmsplash::after{content:"";position:absolute;left:50%;bottom:30%;width:0;height:2px;transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,#BC002D,transparent);border-radius:2px;opacity:0;
    animation:mmLineIn .6s ease .55s forwards;}
  @keyframes mmLogoIn{to{opacity:1;transform:scale(1);}}
  @keyframes mmLineIn{0%{width:0;opacity:0;}60%{opacity:1;}100%{width:min(46vw,210px);opacity:.9;}}
  @keyframes mmSplashOut{to{opacity:0;visibility:hidden;}}
  @media (prefers-reduced-motion:reduce){
    #mmsplash{animation:mmSplashOut .4s ease 2.5s forwards;}
    #mmsplash img{animation:none;opacity:1;transform:none;}
    #mmsplash::after{display:none;}
  }
</style>

function rubricKeyFor(cap){
  if(!cap)return 'MA';
  const n=(cap.name||'');
  if(/General Effect/i.test(n)||cap.family==='GE')return 'GE';
  if(/Color\s*Guard/i.test(n)||cap.isCG)return 'CG';
  if(/Perc.*Pit|Pit/i.test(n))return 'PP';
  if(/Perc.*Battery|Battery/i.test(n))return 'PB';
  if(/Visual/i.test(n)||cap.family==='Visual')return 'VA';
  if(/Music/i.test(n)||cap.family==='Music')return 'MA';
  return 'MA';
}

let dirty=lsGet(LS.queue,{}),syncing=false;
if(Array.isArray(dirty)){const m={};dirty.forEach(q=>{if(q&&q.kind)m[q.kind+'|'+q.jid+'|'+q.bid]={kind:q.kind,jid:q.jid,bid:q.bid};});dirty=m;lsSet(LS.queue,dirty);}
const dkey=(kind,jid,bid)=>kind+'|'+jid+'|'+bid;
function persist(){lsSet(LS.scores,state.scores);lsSet(LS.comments,state.comments);}
/* (kind|jid|bid)ごとに「未同期」フラグだけを持つ。送信直前に state から最新値を読むので、
   通信が遅い間に入力が進んでも、送信中に値が変われば必ず送り直し、Firebaseには常に最新＝完全な値が入る。
   入力が落ち着いてから送る（450ms デバウンス）ので、管理画面に途中の桁が映らない。*/
let flushT=null;
function enqueue(kind,jid,bid){dirty[dkey(kind,jid,bid)]={kind,jid,bid};lsSet(LS.queue,dirty);updateSync();scheduleFlush();}
function scheduleFlush(){clearTimeout(flushT);flushT=setTimeout(flush,450);}
async function flush(){
  clearTimeout(flushT);
  if(syncing)return;syncing=true;
  try{
    let keys=Object.keys(dirty);
    while(keys.length){
      const key=keys[0],it=dirty[key];
      delete dirty[key];lsSet(LS.queue,dirty);              // 送信前に外す→送信中に再入力されれば再登録される
      let url,val;
      if(it.kind==='score'){url=scoreURL(it.jid,it.bid);val=(state.scores[it.jid]&&state.scores[it.jid][it.bid])||null;}
      else{url=commentURL(it.jid,it.bid);val=(state.comments[it.jid]&&state.comments[it.jid][it.bid])||null;}
      try{
        const res=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)});
        if(!res.ok)throw 0;
      }catch(e){dirty[key]=it;lsSet(LS.queue,dirty);updateSync();break;}  // 失敗分は残して再試行
      updateSync();
      keys=Object.keys(dirty);                               // 送信中に増えた分（最新値）も続けて送る
    }
  }finally{syncing=false;}
}
setInterval(()=>{if(Object.keys(dirty).length)flush();},4000);
window.addEventListener('online',flush);
function updateSync(){const el=document.getElementById('syncpill');if(!el)return;const n=Object.keys(dirty).length;
  if(n){el.className='pill wait';el.textContent='送信待ち '+n;}else{el.className='pill ok';el.textContent='同期済み';}}

function entry(jid,bid){return (state.scores[jid]&&state.scores[jid][bid])||{};}
function capFieldsOf(jid){const c=capOf(judgeOf(jid));return c?c.fields:[];}
function ttlOf(jid,bid){const f=capFieldsOf(jid),e=entry(jid,bid);if(!f.length)return null;const v=f.map(k=>e[k]);if(v.some(x=>x==null||x===''))return null;return (Number(v[0])+Number(v[1]))/10;}
function isComplete(jid,bid){const f=capFieldsOf(jid),e=entry(jid,bid);return f.length&&f.every(k=>e[k]!=null&&e[k]!=='');}
function computeStandings(jid){
  const rows=curBands().map(b=>({band:b,ttl:bandLocked(b)?null:ttlOf(jid,b.id)}));
  const ent=rows.filter(r=>r.ttl!=null);ent.forEach(r=>r.rank=1+ent.filter(o=>o.ttl>r.ttl).length);
  return rows.sort((a,b)=>{if(a.ttl==null&&b.ttl==null)return a.band.no-b.band.no;if(a.ttl==null)return 1;if(b.ttl==null)return -1;return a.rank-b.rank||a.band.no-b.band.no;});
}
/* full recap engine (shared) */
const FACTOR=f=>(FAMILIES[f]&&FAMILIES[f].factor)||(f==='GE'?2:1.5);
function allTtl(jid,bid){const c=capOf(judgeOf(jid));if(!c)return null;const s=state.allScores[jid]&&state.allScores[jid][bid];if(!s)return null;const v=c.fields.map(k=>s[k]);if(v.some(x=>x==null||x===''))return null;return (Number(v[0])+Number(v[1]))/10;}
function famSub(bid,fam,hasCG){let caps;if(fam==='Visual'){const vis=CAPTIONS.filter(c=>c.family==='Visual');caps=(hasCG?vis:vis.filter(c=>!c.isCG));}else caps=CAPTIONS.filter(c=>c.family===fam);
  const t=caps.map(c=>{const j=JUDGES.find(j=>j.captionId===c.id);return j?allTtl(j.id,bid):null;}).filter(x=>x!=null);
  if(!t.length)return null;return (t.reduce((a,b)=>a+b,0)/t.length)*FACTOR(fam);}
function finalOf(band){const e=famSub(band.id,'GE',band.hasCG!==false),v=famSub(band.id,'Visual',band.hasCG!==false),m=famSub(band.id,'Music',band.hasCG!==false);return (e||0)+(v||0)+(m||0);}
function prizeOf(band,final){const r=PRIZE.find(p=>p.classId===band.classId);if(!r||final==null)return'';if(final>=r.gold)return'金賞';if(final>=r.silver)return'銀賞';if(r.bronze!=null&&final>=r.bronze)return'銅賞';return'';}
/* per-judge breakdown helpers (final recap #4) */
function famJudges(fam,hasCG){let caps;if(fam==='Visual'){const vis=CAPTIONS.filter(c=>c.family==='Visual');caps=hasCG?vis:vis.filter(c=>!c.isCG);}else caps=CAPTIONS.filter(c=>c.family===fam);
  const js=[];caps.forEach(c=>{const j=JUDGES.find(j=>j.captionId===c.id);if(j)js.push(j);});return js;}
function judgeRankOf(jid,bid){const arr=curBands().map(b=>({id:b.id,t:allTtl(jid,b.id)})).filter(x=>x.t!=null);const me=arr.find(x=>x.id===bid);if(!me)return null;return 1+arr.filter(x=>x.t>me.t).length;}
function breakdownHTML(band){
  const hasCG=band.hasCG!==false;const fams=[['GE','General Effect'],['Visual','Visual'],['Music','Music']];let h='<div class="jd">';let any=false;
  fams.forEach(fm=>{const fam=fm[0],label=fm[1];const js=famJudges(fam,hasCG);if(!js.length)return;
    const rows=js.map(j=>({j,t:allTtl(j.id,band.id),rk:judgeRankOf(j.id,band.id)}));
    any=true;h+=`<div class="jd-fam">${label}</div>`;
    h+=rows.map(r=>{const me=r.j.id===state.judgeId;return `<div class="jd-row ${me?'me':''}"><span class="jn">${r.j.name}</span><span class="jt">${r.t!=null?r.t.toFixed(2):'未'}</span><span class="jr">${r.rk!=null?r.rk+'位':'–'}</span></div>`;}).join('');
  });
  h+='</div>';
  return any?h:'';
}
function firstUnentered(){const jid=state.judgeId;const cg=isCGJudge();for(const b of BANDS){if(cg&&b.hasCG===false)continue;if(!isComplete(jid,b.id))return b;}return null;}

/* ===================== boot ===================== */
const app=document.getElementById('app');
async function loadConfig(){try{const res=await fetch(cfgURL,{cache:'no-store'});if(!res.ok)throw 0;const c=await res.json();if(!c||!c.captions)throw 0;lsSet(LS.cfg,c);return c;}catch(e){const c=lsGet(LS.cfg,null);if(c)return c;throw new Error('設定を読み込めません');}}
/* 大会設定のライブ反映（出演順・団体追加/削除・名称変更などを稼働中に自動反映）*/
function cfgHash(c){try{return JSON.stringify({e:c.event,c:c.captions,j:c.judges,b:c.bands,d:c.divisions,cl:c.classes,f:c.families,p:c.prizeRules});}catch(_){return'';}}
let lastCfgHash='';
function applyConfig(c){
  CAPTIONS=c.captions;JUDGES=c.judges;BANDS=c.bands;EV=c.event||EV;
  DIVISIONS=c.divisions||[];CLASSES=c.classes||[];FAMILIES=c.families||{};PRIZE=c.prizeRules||[];
  showTestBadge(!!(EV&&EV.test));
  if(!DIVISIONS.some(d=>d.id===state.curDiv))state.curDiv=(DIVISIONS[0]||{}).id||null;
  if(state.judgeId&&!JUDGES.some(j=>j.id===state.judgeId)){state.judgeId=null;state.pendingJudge=null;render();return;}
  if(curBands().length===0){const d=DIVISIONS.find(dv=>BANDS.some(b=>b.division===dv.id));if(d)state.curDiv=d.id;}
  const nb=curBands().length;if(state.bandIndex>=nb)state.bandIndex=Math.max(0,nb-1);
  render();
}
async function pollConfig(){
  try{const res=await fetch(cfgURL,{cache:'no-store'});if(!res.ok)return;const c=await res.json();if(!c||!c.captions)return;
    const h=cfgHash(c);if(h===lastCfgHash)return;
    const ae=document.activeElement;if(ae&&ae.tagName==='INPUT')return;   // コメント入力中などは次回に回す
    lastCfgHash=h;lsSet(LS.cfg,c);applyConfig(c);toast('大会設定が更新されました');
  }catch(e){}
}
/* ログイン時に自分のスコア・コメントをFirebaseから復元（別端末でも続きから入力できる）*/
async function loadMyData(jid){
  try{
    const [sc,cm]=await Promise.all([
      fetch(scoresOfURL(jid),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(commentsOfURL(jid),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    state.scores[jid]=state.scores[jid]||{};
    if(sc&&typeof sc==='object')for(const bid in sc){if(!queue.some(q=>q.kind==='score'&&q.jid===jid&&q.bid===bid))state.scores[jid][bid]=sc[bid];}
    state.comments[jid]=state.comments[jid]||{};
    if(cm&&typeof cm==='object')for(const bid in cm){if(!queue.some(q=>q.kind==='comment'&&q.jid===jid&&q.bid===bid))state.comments[jid][bid]=cm[bid];}
    persist();
  }catch(e){}
}
let _tb=null;
function showTestBadge(on){
  if(on){if(!_tb){_tb=document.createElement('div');_tb.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:99999;background:#f5a623;color:#1a0f0c;font:600 11px Inter,system-ui,sans-serif;padding:2px 12px;border-radius:0 0 8px 8px;letter-spacing:.06em;';document.body.appendChild(_tb);}_tb.textContent='TEST: '+CONFIG.EVENT_ID;if(!/^\[TEST\] /.test(document.title))document.title='[TEST] '+document.title;}
  else if(_tb){_tb.remove();_tb=null;document.title=document.title.replace(/^\[TEST\] /,'');}
}
async function boot(){
  app.innerHTML='<div style="padding:70px 22px;text-align:center;color:#8b96ad">設定を読み込み中…</div>';
  try{
    const cfg=await loadConfig();
    CAPTIONS=cfg.captions;JUDGES=cfg.judges;BANDS=cfg.bands;EV=cfg.event||EV;
    DIVISIONS=cfg.divisions||[];CLASSES=cfg.classes||[];FAMILIES=cfg.families||{};PRIZE=cfg.prizeRules||[];
    state.curDiv=(DIVISIONS[0]||{}).id||null;
    showTestBadge(!!(EV&&EV.test));
    lastCfgHash=cfgHash(cfg);
    render();flush();pollShare();setInterval(pollShare,8000);setInterval(pollStatus,6000);setInterval(pollConfig,20000);
  }catch(e){app.innerHTML='<div style="padding:60px 24px;text-align:center;color:#e8705a;line-height:1.8">設定を読み込めませんでした。<br>ネット接続を確認して再読み込みしてください。</div>';}
}
async function pollShare(){
  try{const s=await (await fetch(shareURL)).json();const ns=(s&&s.state)||'none';
    if(ns!==state.shareState){state.shareState=ns;if(state.tab==='ranking')render();}
    else state.shareState=ns;}catch(e){}
  if(state.shareState==='shared'){try{state.allScores=(await (await fetch(allScoresURL)).json())||{};if(state.tab==='ranking'&&state.rankMode==='final')render();}catch(e){}}
}
async function loadStatus(){try{const s=await (await fetch(statusURL(state.judgeId))).json();state.decided=!!(s&&s.decided);state.finalConfirmed=!!(s&&s.finalConfirmed);state.editRequest=!!(s&&s.editRequest);}catch(e){state.decided=false;state.finalConfirmed=false;state.editRequest=false;}}
function putStatus(){lastStatusWrite=Date.now();fetch(statusURL(state.judgeId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({decided:state.decided,finalConfirmed:state.finalConfirmed,editRequest:state.editRequest,at:Date.now()})}).catch(()=>{});}
/* 運営側のロック解除をリアルタイムで反映する */
async function pollStatus(){
  if(!state.judgeId)return;
  if(Date.now()-lastStatusWrite<4000)return;            // 自分の書き込み直後は上書きしない
  try{const s=await (await fetch(statusURL(state.judgeId))).json();
    const nd=!!(s&&s.decided),nf=!!(s&&s.finalConfirmed),ne=!!(s&&s.editRequest);
    if(nd!==state.decided||nf!==state.finalConfirmed||ne!==state.editRequest){
      const wasLocked=scoreLocked();
      state.decided=nd;state.finalConfirmed=nf;state.editRequest=ne;
      render();
      if(wasLocked&&!scoreLocked())toast('運営がロックを解除しました。修正できます。');
    }
  }catch(e){}
}
let _toastT=null;
function toast(msg){let el=document.getElementById('mmtoast');if(!el){el=document.createElement('div');el.id='mmtoast';el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;background:var(--gold);color:#fff;font:600 13px var(--body);padding:11px 18px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90%;text-align:center;';document.body.appendChild(el);}el.textContent=msg;el.style.opacity='1';clearTimeout(_toastT);_toastT=setTimeout(()=>{el.style.transition='opacity .4s';el.style.opacity='0';},3200);}
function requestEdit(){state.editRequest=true;putStatus();render();toast('運営に修正をリクエストしました。');}
function cancelEditRequest(){state.editRequest=false;putStatus();render();}
function lockBarHTML(){
  return state.editRequest
   ? `<div class="lockrow"><div class="lockmsg">⏳ 修正リクエスト中 — 運営がロックを解除するとスコアを修正できます</div><button class="reqbtn cancel" id="req-cancel">リクエストを取消</button></div>`
   : `<div class="lockrow"><div class="lockmsg">決定・最終確認の後はスコアを変更できません。修正が必要な場合は運営に解除をリクエストしてください。</div><button class="reqbtn" id="req-edit">修正をリクエスト</button></div>`;
}
function wireLockBar(root){root=root||document;const e=root.querySelector('#req-edit');if(e)e.addEventListener('click',requestEdit);const c=root.querySelector('#req-cancel');if(c)c.addEventListener('click',cancelEditRequest);}

/* ===================== render ===================== */
function render(){if(state.judgeId)renderMain();else if(state.pendingJudge)renderPin();else renderSelect();}

function renderSelect(){
  const FAM={GE:'General Effect',Visual:'Visual',Music:'Music'};const groups={GE:[],Visual:[],Music:[]};
  JUDGES.forEach(j=>{const c=capOf(j);if(c&&groups[c.family])groups[c.family].push(j);});
  app.innerHTML=`<div class="body"><div class="sel">
    <div class="logobar"><img class="mm-logo" src="${LOGO}" alt="FormaSyncM"></div>
    <h1>${EV.name||'Marching Matsuri'}</h1><p>お名前を選んでください</p>
    ${Object.keys(groups).map(f=>groups[f].length?`<div class="famlabel">${FAM[f]}</div>`+groups[f].map(j=>{const c=capOf(j);
      return `<button class="jb" data-j="${j.id}"><span><span class="n">${j.name}</span><span class="c">${c?c.name:''}</span></span><span class="chev">›</span></button>`;}).join(''):'').join('')}
  </div></div>`;
  app.querySelectorAll('.jb').forEach(b=>b.addEventListener('click',async()=>{
    const j=judgeOf(b.dataset.j);
    if(j&&/^\d{4}$/.test(String(j.pin||''))){state.pendingJudge=j.id;state.pinBuf='';state.pinErr=false;render();return;}
    await enterJudge(b.dataset.j);

}
async function enterJudge(jid){state.judgeId=jid;state.pendingJudge=null;state.pinBuf='';state.bandIndex=0;state.tab='input';await loadStatus();await loadMyData(jid);render();}
function renderPin(){
  const j=judgeOf(state.pendingJudge);if(!j){state.pendingJudge=null;return render();}
  const cap=capOf(j);const n=state.pinBuf.length;
  app.innerHTML=`<div class="body"><div class="pin" id="pinroot">
    <button class="back" id="pinback">‹ ジャッジ選択へ戻る</button>
    <div class="phead"><div class="pn">${j.name}</div><div class="pc">${cap?cap.name:''}</div></div>
    <div class="ptip">本人確認のため、4桁のPINを入力してください</div>
    <div class="pindots">${[0,1,2,3].map(i=>`<div class="pindot ${i<n?'on':''}"></div>`).join('')}</div>
    <div class="pinerr">${state.pinErr?'PINが違います。もう一度入力してください。':''}</div>
    <div class="pinpad">
      ${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="pinkey" data-pk="${d}">${d}</button>`).join('')}
      <button class="pinkey blank"></button>
      <button class="pinkey" data-pk="0">0</button>
      <button class="pinkey util" data-pk="back">⌫</button>
    </div>
  </div></div>`;
  app.querySelector('#pinback').addEventListener('click',()=>{state.pendingJudge=null;state.pinBuf='';state.pinErr=false;render();});
  app.querySelectorAll('.pinkey[data-pk]').forEach(k=>k.addEventListener('click',()=>onPin(k.dataset.pk)));
}
function onPin(k){
  const j=judgeOf(state.pendingJudge);if(!j)return;
  if(k==='back'){state.pinBuf=state.pinBuf.slice(0,-1);state.pinErr=false;render();return;}
  if(state.pinBuf.length>=4)return;
  state.pinBuf+=k;state.pinErr=false;
  if(state.pinBuf.length===4){
    if(state.pinBuf===String(j.pin)){enterJudge(j.id);}
    else{state.pinErr=true;state.pinBuf='';render();const r=document.getElementById('pinroot');if(r){r.classList.add('shake');setTimeout(()=>r.classList.remove('shake'),320);}}
    return;
  }
  render();
}

      </div>
      <div class="ttlbar"><span class="lab">Total</span><span class="val">${ttl!=null?ttl.toFixed(2):'––.––'}</span>${me&&me.rank?`<span class="rk">${me.rank}位</span>`:''}</div>
      <div class="cmt"><input id="cmt" placeholder="コメント（任意）" value="${String(cmt).replace(/"/g,'&quot;')}" ${slk?'disabled':''}></div>
    </div>
    ${bottom}
  </div>`;
  if(!slk){
    body.querySelectorAll('.fbox').forEach(fb=>fb.addEventListener('click',()=>{state.active=+fb.dataset.f;state.buf=String(e[fields[state.active]]??'');render();}));
    body.querySelectorAll('.key').forEach(k=>k.addEventListener('click',()=>onKey(k.dataset.k)));
    const ci=document.getElementById('cmt');ci.addEventListener('input',()=>onComment(ci.value));
  }
  wireNav(bands);
}
function wireNav(bands){
  const p=document.getElementById('prev'),n=document.getElementById('next');
  if(p)p.addEventListener('click',()=>{if(state.bandIndex>0){state.bandIndex--;state.active=0;state.buf='';render();}});
  if(n)n.addEventListener('click',()=>{state.bandIndex=(state.bandIndex+1)%bands.length;state.active=0;state.buf='';render();});
}
function onKey(k){
  if(scoreLocked())return;
  const judge=judgeOf(state.judgeId),cap=capOf(judge),band=curBands()[state.bandIndex];
  const field=cap.fields[state.active];
  let buf=state.buf||'';
  if(k==='clear')buf='';
  else if(k==='back')buf=buf.slice(0,-1);
  else{const nb=buf+k;if(parseInt(nb,10)>100)buf=k==='0'?'100':String(parseInt(k,10));else buf=nb.replace(/^0+(?=\d)/,'');}
  state.buf=buf;
  const val=buf===''?null:Math.min(100,parseInt(buf,10));
  state.scores[judge.id]=state.scores[judge.id]||{};state.scores[judge.id][band.id]=state.scores[judge.id][band.id]||{};
  if(val==null)delete state.scores[judge.id][band.id][field];else state.scores[judge.id][band.id][field]=val;
  if(Object.keys(state.scores[judge.id][band.id]).length===0)delete state.scores[judge.id][band.id];
  persist();enqueue('score',judge.id,band.id);autoUndecide();
  // auto-advance to 2nd field when 1st reaches 2+ digits? keep manual. just refresh values
  refreshInputValues();
}
function refreshInputValues(){
  const judge=judgeOf(state.judgeId),cap=capOf(judge),band=curBands()[state.bandIndex];const e=entry(judge.id,band.id);
  const boxes=document.querySelectorAll('.fbox');
  cap.fields.forEach((f,i)=>{if(boxes[i]){const v=e[f];const has=(v!=null&&v!=='');const fv=boxes[i].querySelector('.fv');fv.textContent=has?v:'––';fv.classList.toggle('empty',!has);boxes[i].classList.toggle('active',state.active===i);const bx=boxOf(v);const bt=boxes[i].querySelector('.boxtag');if(bt){bt.className='boxtag '+(bx?'b'+bx:'empty');bt.textContent=bx?('BOX'+bx):'–';}}});
  const ttl=ttlOf(judge.id,band.id);const tv=document.querySelector('.ttlbar .val');if(tv)tv.textContent=ttl!=null?ttl.toFixed(2):'––.––';
  const st=computeStandings(judge.id);const me=st.find(r=>r.band.id===band.id);const rk=document.querySelector('.ttlbar .rk');if(rk)rk.textContent=me&&me.rank?me.rank+'位':'';
}
function onComment(v){
  if(scoreLocked())return;
  const judge=judgeOf(state.judgeId),band=curBands()[state.bandIndex];
  state.comments[judge.id]=state.comments[judge.id]||{};
  if(v.trim()==='')delete state.comments[judge.id][band.id];else state.comments[judge.id][band.id]=v;
  persist();enqueue('comment',judge.id,band.id);autoUndecide();
}
function autoUndecide(){ let ch=false;
  if(state.decided){state.decided=false;ch=true;const d=document.getElementById('decide');if(d){d.className='decidebtn';d.textContent='全て入力・確認したら決定';}}
  if(state.finalConfirmed){state.finalConfirmed=false;ch=true;}
  if(ch)putStatus(); }
function toggleDecide(){
  if(state.decided)return;                       // 決定は一方向（取消は運営のロック解除のみ）
  const ub=firstUnentered();
  if(ub){
    alert('未入力の団体があります：\nNO.'+String(ub.no).padStart(2,'0')+'　'+ub.name+'\n\nこの団体の入力画面へ移動します。');
    if(ub.division)state.curDiv=ub.division;
    const idx=curBands().findIndex(b=>b.id===ub.id);
    state.bandIndex=idx>=0?idx:0;state.tab='input';state.active=0;state.buf='';render();
    return;
  }
  if(!confirm('スコアを決定します。\n決定後は点数を変更できません（修正は運営にリクエストが必要です）。\n\nよろしいですか？'))return;
  state.decided=true;state.editRequest=false;flush();putStatus();render();}

function renderRanking(){
  const judge=judgeOf(state.judgeId);const shared=state.shareState==='shared';
  const body=document.getElementById('body');
  const toggle=`<div class="rtoggle">
    <button class="${state.rankMode==='self'?'active':''}" data-rm="self">自分の採点順</button>
    <button class="${state.rankMode==='final'?'active':''}" data-rm="final" ${shared?'':'disabled'}>最終リキャップ${shared?'':'（共有待ち）'}</button></div>`;
  if(state.rankMode==='final'&&shared){
    const bands=curBands().map(b=>({band:b,final:finalOf(b)}));
    const ent=bands.filter(r=>r.final!=null);ent.forEach(r=>r.rank=1+ent.filter(o=>o.final>r.final).length);
    ent.sort((a,b)=>a.rank-b.rank||a.band.no-b.band.no);
    const counts={};ent.forEach(r=>{const k=r.final.toFixed(3);counts[k]=(counts[k]||0)+1;});
    const fc=state.finalConfirmed;
    body.innerHTML=`<div class="rank final">${toggle}
      <div class="st-head"><span></span><span class="hn">団体</span><span>GE</span><span>VIS</span><span>MUS</span><span>FINAL</span></div>
      ${ent.map(r=>{const hasCG=r.band.hasCG!==false;const ge=famSub(r.band.id,'GE',hasCG),vi=famSub(r.band.id,'Visual',hasCG),mu=famSub(r.band.id,'Music',hasCG);const open=state.expBand===r.band.id;
        let h=`<div class="st-row exp ${open?'open':''}" data-bid="${r.band.id}"><span class="st-rk">${r.rank}<span class="u">位</span></span>
        <span class="st-nm"><span class="no">${String(r.band.no).padStart(2,'0')}</span><span class="bn">${r.band.name}</span></span>
        <span class="st-sub">${ge!=null?ge.toFixed(1):'–'}</span><span class="st-sub">${vi!=null?vi.toFixed(1):'–'}</span><span class="st-sub">${mu!=null?mu.toFixed(1):'–'}</span>
        <span class="st-ttl">${r.final.toFixed(3)}</span>
        <span class="st-chev">${open?'▲ ジャッジ別を閉じる':'▼ ジャッジ別スコア'}</span></div>`;
        if(open)h+=breakdownHTML(r.band);return h;}).join('')}
      <p class="rinfo">全ジャッジ集計後の最終順位（${divName(state.curDiv)}）。行をタップすると各ジャッジのスコア・順位が見られます。</p>
      ${fc
        ? `<div class="fconfirm"><div class="lockstatus">✓ 最終確認済み（ロック中）</div><div class="fcnote">運営に「最終スコア決定」として送信済みです。</div>${lockBarHTML()}</div>`
        : `<div class="fconfirm" id="fcwrap"><button class="fcbtn" id="fcbtn">最終確認（この内容で確定）</button><div class="fcnote">全ジャッジのスコアを確認し、問題なければ最終確認してください。確定後はスコアがロックされます。</div>${scoreLocked()?lockBarHTML():''}</div>`}
      </div>`;
    body.querySelectorAll('.st-row.exp').forEach(row=>row.addEventListener('click',()=>{const bid=row.dataset.bid;state.expBand=(state.expBand===bid)?null:bid;render();}));
    wireLockBar(body);
    const fcb=body.querySelector('#fcbtn');
    if(fcb)fcb.addEventListener('click',()=>{
      const w=body.querySelector('#fcwrap');
      w.innerHTML=`<div class="fcnote" style="margin-bottom:10px">この順位・スコアを最終として確定します。確定後はスコアがロックされます。よろしいですか？</div>
        <div style="display:flex;gap:8px"><button class="fcbtn" id="fcyes">確定する</button>
        <button class="fcbtn" id="fcno" style="background:transparent;color:var(--muted);border-color:var(--line)">キャンセル</button></div>`;
      w.querySelector('#fcyes').addEventListener('click',()=>{state.finalConfirmed=true;state.editRequest=false;putStatus();render();});
      w.querySelector('#fcno').addEventListener('click',()=>render());
    });
  }else{
    const st=computeStandings(judge.id);const cap=capOf(judge);const f=cap?cap.fields:['①','②'];
    const counts={};st.forEach(r=>{if(r.ttl!=null){const k=r.ttl.toFixed(2);counts[k]=(counts[k]||0)+1;}});
    const ties=Object.values(counts).filter(c=>c>1).length;
    const curId=(curBands()[state.bandIndex]||{}).id;
    body.innerHTML=`<div class="rank">${toggle}
      ${ties?`<div class="st-warn">⚠ 同点が ${ties}組あります</div>`:''}
      <div class="st-head"><span></span><span class="hn">団体</span><span>${f[0]}</span><span>${f[1]}</span><span>Total</span></div>
      ${st.map(r=>{const empty=r.ttl==null;const tie=!empty&&counts[r.ttl.toFixed(2)]>1;const e=entry(judge.id,r.band.id);
        return `<div class="st-row nav ${r.band.id===curId?'cur':''} ${empty?'empty':''} ${tie?'tie':''}" data-bid="${r.band.id}" style="cursor:pointer">
        <span class="st-rk">${empty?'–':r.rank+'<span class="u">位</span>'}</span>
        <span class="st-nm"><span class="no">${String(r.band.no).padStart(2,'0')}</span><span class="bn">${r.band.name}</span></span>
        <span class="st-sub">${empty?'–':(e[f[0]]??'–')}</span><span class="st-sub">${empty?'–':(e[f[1]]??'–')}</span>
        <span class="st-ttl">${empty?'––.––':r.ttl.toFixed(2)}</span></div>`;}).join('')}
      <p class="rinfo">あなたの採点順（${divName(state.curDiv)}）。行をタップするとその団体の入力画面へ移動します。${shared?'「最終リキャップ」で全体順位も見られます。':'全体の最終順位は運営が共有後に表示されます。'}</p></div>`;
    body.querySelectorAll('.st-row.nav').forEach(row=>row.addEventListener('click',()=>{const idx=curBands().findIndex(b=>b.id===row.dataset.bid);if(idx>=0){state.bandIndex=idx;state.tab='input';state.active=0;state.buf='';render();}}));
  }
  body.querySelectorAll('.rtoggle button').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;state.rankMode=b.dataset.rm;if(state.rankMode==='final')pollShare();render();}));
}

// ピンチズームの誤作動だけ抑止（ダブルタップズームは touch-action:manipulation で無効化済み・タップ入力は妨げない）
document.addEventListener('gesturestart',function(e){e.preventDefault();});

boot();
</script></body>
</html>
