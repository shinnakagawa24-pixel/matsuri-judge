<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>審査員入力 — Marching Matsuri Judge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@600;700&family=Inter:wght@400;500;600&display=swap');
  :root{
    --field:#0e1320;--panel:#161d2e;--panel-2:#1d2740;--line:#2a3650;--ink:#eef2fb;--muted:#8b96ad;
    --gold:#f2b03d;--gold-dim:#9c7327;--signal:#5fd0c5;--danger:#e8705a;--green:#3fbf6f;
    --display:'Oswald','Arial Narrow',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{height:100%;touch-action:manipulation;}
  .app{touch-action:manipulation;}
  .key,.navbtn,.tab,.divtab,.fbox,.jb,.ghost,.decidebtn,.rtoggle button{touch-action:manipulation;}
  body{background:var(--field);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  .app{max-width:460px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}

  /* top */
  .top{flex:0 0 auto;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .top .who{flex:1;min-width:0;}
  .top .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top .cap{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);}
  .pill{font-size:10px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid;white-space:nowrap;}
  .pill.ok{color:var(--signal);border-color:#2f5e58;}
  .pill.wait{color:var(--gold);border-color:var(--gold-dim);}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:11px;border-radius:8px;padding:6px 9px;cursor:pointer;font-family:var(--body);}

  /* division tabs */
  .divtabs{flex:0 0 auto;display:flex;gap:6px;padding:8px 14px 0;}
  .divtab{flex:1;padding:8px;border-radius:9px 9px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--panel);color:var(--muted);font-family:var(--display);font-weight:600;font-size:12px;cursor:pointer;}
  .divtab.active{background:var(--gold);color:#1a1305;border-color:var(--gold);}

  /* main tabs */
  .tabs{flex:0 0 auto;display:flex;border-bottom:1px solid var(--line);}
  .tab{flex:1;padding:12px 4px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.06em;cursor:pointer;}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold);}

  .body{flex:1;min-height:0;overflow-y:auto;}

  /* select screen */
  .sel{padding:20px 16px 40px;}
  .sel h1{font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:4px;}
  .sel p{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .famlabel{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--ink);display:flex;align-items:center;gap:9px;margin:16px 0 9px;}
  .famlabel::after{content:"";flex:1;height:1px;background:var(--line);}
  .jb{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:8px;color:var(--ink);text-align:left;cursor:pointer;font-family:var(--body);}
  .jb .n{font-size:16px;font-weight:600;}
  .jb .c{font-size:11px;color:var(--muted);margin-top:2px;}
  .jb .chev{color:var(--gold);font-size:20px;}

  /* criteria tab */
  .crit{padding:18px 18px 40px;}
  .crit .band{font-family:var(--display);font-weight:600;font-size:18px;margin-bottom:12px;}
  .crit .item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--panel);}
  .crit .item h3{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.05em;}
  .crit .item p{color:var(--muted);font-size:12.5px;margin-top:5px;line-height:1.5;}
  .crit .note{color:var(--muted);font-size:12px;line-height:1.7;margin-top:6px;}
  .crit .note code{font-family:var(--mono);color:var(--ink);background:var(--panel);padding:1px 6px;border-radius:5px;}

  /* input tab — fits one screen, no scroll */
  .inp{display:flex;flex-direction:column;height:100%;overflow:hidden;}
  .bandbar{flex:0 0 auto;padding:7px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .bandbar .bn{min-width:0;}
  .bandbar .no{font-family:var(--mono);font-size:10px;color:var(--gold);}
  .bandbar .tm{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bandbar .meta{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--display);}
  .navbtn{width:36px;height:36px;flex:0 0 36px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;font-size:17px;cursor:pointer;}
  .navbtn[disabled]{opacity:.3;}

  .fields{flex:0 0 auto;display:flex;gap:8px;padding:8px 14px 4px;}
  .fbox{flex:1;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:5px 6px;text-align:center;cursor:pointer;}
  .fbox.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,176,61,.14);}
  .fbox .fl{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .fbox .fv{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1.05;}
  .fbox.active .fv{color:var(--gold);}
  .fbox .fv.empty{color:var(--line);}
  .ttlbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:9px;padding:3px 14px;}
  .ttlbar .lab{font-family:var(--display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .ttlbar .val{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--signal);}
  .ttlbar .rk{font-family:var(--display);font-size:10px;color:var(--gold);letter-spacing:.05em;}

  .cglock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--muted);}
  .cglock .big{font-family:var(--display);font-weight:600;font-size:20px;color:var(--danger);margin-bottom:8px;}

  .cmt{flex:0 0 auto;padding:2px 14px 4px;}
  .cmt input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:var(--body);font-size:13px;padding:7px 11px;outline:none;}
  .cmt input:focus{border-color:var(--gold);}

  .keypad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:6px;padding:4px 14px 10px;}
  .key{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;font-family:var(--mono);font-weight:700;font-size:22px;cursor:pointer;user-select:none;min-height:0;}
  .key:active{background:var(--panel-2);border-color:var(--gold-dim);}
  .key.util{font-family:var(--display);font-size:15px;color:var(--muted);letter-spacing:.03em;}

  /* ranking tab */
  .rank{padding:10px 0 30px;}
  .rtoggle{display:flex;gap:6px;padding:10px 16px;}
  .rtoggle button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--display);font-weight:600;font-size:12px;cursor:pointer;}
  .rtoggle button.active{background:var(--gold);color:#1a1305;border-color:var(--gold);}
  .rtoggle button[disabled]{opacity:.4;}
  .st-warn{display:flex;align-items:center;gap:8px;margin:6px 14px;padding:8px 11px;border:1px solid var(--danger);background:rgba(232,112,90,.12);border-radius:9px;color:var(--danger);font-size:11.5px;font-weight:600;}
  .st-head,.st-row{display:grid;grid-template-columns:30px 1fr 42px 42px 52px;align-items:center;gap:8px;padding:9px 14px;}
  .st-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .st-head span{text-align:center;} .st-head .hn{text-align:left;}
  .st-row{border-left:3px solid transparent;}
  .st-row.cur{background:rgba(242,176,61,.08);border-left-color:var(--gold);}
  .st-row.tie{background:rgba(232,112,90,.10);border-left-color:var(--danger);}
  .st-row.empty{opacity:.5;}
  .st-rk{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--signal);text-align:center;}
  .st-row.cur .st-rk{color:var(--gold);} .st-row.tie .st-rk{color:var(--danger);}
  .st-nm{min-width:0;} .st-nm .no{font-family:var(--mono);font-size:10px;color:var(--muted);margin-right:6px;}
  .st-nm .bn{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:100%;vertical-align:bottom;}
  .st-sub{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center;}
  .st-ttl{font-family:var(--mono);font-weight:700;font-size:15px;text-align:center;}
  .st-row.empty .st-sub,.st-row.empty .st-ttl{color:var(--line);}
  /* final recap: wider numeric columns, smaller font (prevent overlap) */
  .rank.final .st-head,.rank.final .st-row{grid-template-columns:26px 1fr 46px 74px 60px;gap:6px;padding:9px 12px;}
  .rank.final .st-sub{font-size:11px;letter-spacing:-.02em;}
  .rank.final .st-ttl{font-size:13px;}
  .rank.final .st-rk{font-size:15px;}
  .rank.final .st-nm .bn{font-size:12px;}
  .rinfo{color:var(--muted);font-size:12px;padding:10px 16px;line-height:1.6;}

  /* decide bar */
  .decide{flex:0 0 auto;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel);}
  .decidebtn{width:100%;padding:14px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:#1a1305;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
  .decidebtn.done{background:rgba(63,191,111,.14);color:var(--green);border-color:var(--green);}
  .decidebtn:active{transform:scale(.99);}
  .decidenote{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===================== Firebase ===================== */
const CONFIG={DB_URL:"https://marching-matsuri-judge-default-rtdb.asia-southeast1.firebasedatabase.app",EVENT_ID:"shonan-2026"};
const BASE=CONFIG.DB_URL.replace(/\/+$/,'');
const cfgURL=`${BASE}/events/${CONFIG.EVENT_ID}/config.json`;
const scoreURL=(j,b)=>`${BASE}/events/${CONFIG.EVENT_ID}/scores/${j}/${b}.json`;
const commentURL=(j,b)=>`${BASE}/events/${CONFIG.EVENT_ID}/comments/${j}/${b}.json`;
const statusURL=(j)=>`${BASE}/events/${CONFIG.EVENT_ID}/judgeStatus/${j}.json`;
const shareURL=`${BASE}/events/${CONFIG.EVENT_ID}/share.json`;
const allScoresURL=`${BASE}/events/${CONFIG.EVENT_ID}/scores.json`;
const LS={cfg:'mmj_cfg_'+CONFIG.EVENT_ID,queue:'mmj_q_'+CONFIG.EVENT_ID,scores:'mmj_s_'+CONFIG.EVENT_ID,comments:'mmj_c_'+CONFIG.EVENT_ID};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ===================== config/state ===================== */
let EV={name:'Marching Matsuri',date:''};
let CAPTIONS=[],JUDGES=[],BANDS=[],DIVISIONS=[],CLASSES=[],FAMILIES={},PRIZE=[];
const state={judgeId:null,curDiv:null,tab:'input',bandIndex:0,active:0,buf:'',
  scores:lsGet(LS.scores,{}),comments:lsGet(LS.comments,{}),decided:false,
  shareState:'none',allScores:{},rankMode:'self'};
const FIELD_DESC={Rep:'Repertoire Effect / 構成の効果',Pfm:'Performers Effect / 奏者の表現',
  Cont:'Content / 内容',Achv:'Achievement / 達成度',Sbst:'Substance / 内容の充実'};

const judgeOf=id=>JUDGES.find(j=>j.id===id);
const capOf=j=>CAPTIONS.find(c=>c.id===(j&&j.captionId));
const capById=id=>CAPTIONS.find(c=>c.id===id);
const clsLabel=b=>(CLASSES.find(c=>c.id===b.classId)||{}).label||'';
const divName=id=>(DIVISIONS.find(d=>d.id===id)||{}).name||id;
function curBands(){return state.curDiv?BANDS.filter(b=>b.division===state.curDiv):BANDS;}
function isCGJudge(){const c=capOf(judgeOf(state.judgeId));return !!(c&&c.isCG);}
function bandLocked(band){return isCGJudge() && band && band.hasCG===false;}

/* ===================== sync queue (score + comment) ===================== */
let queue=lsGet(LS.queue,[]),syncing=false;
function persist(){lsSet(LS.scores,state.scores);lsSet(LS.comments,state.comments);}
function enqueue(kind,jid,bid){queue=queue.filter(q=>!(q.kind===kind&&q.jid===jid&&q.bid===bid));queue.push({kind,jid,bid});lsSet(LS.queue,queue);updateSync();flush();}
async function flush(){
  if(syncing||!queue.length)return;syncing=true;
  while(queue.length){
    const it=queue[0];
    try{
      let url,val;
      if(it.kind==='score'){url=scoreURL(it.jid,it.bid);val=(state.scores[it.jid]&&state.scores[it.jid][it.bid])||null;}
      else{url=commentURL(it.jid,it.bid);val=(state.comments[it.jid]&&state.comments[it.jid][it.bid])||null;}
      const res=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)});
      if(!res.ok)throw 0;
      queue.shift();lsSet(LS.queue,queue);updateSync();
    }catch(e){updateSync();break;}
  }
  syncing=false;
}
setInterval(()=>{if(queue.length)flush();},4000);
window.addEventListener('online',flush);
function updateSync(){const el=document.getElementById('syncpill');if(!el)return;
  if(queue.length){el.className='pill wait';el.textContent='送信待ち '+queue.length;}else{el.className='pill ok';el.textContent='同期済み';}}

/* ===================== scoring helpers ===================== */
function entry(jid,bid){return (state.scores[jid]&&state.scores[jid][bid])||{};}
function capFieldsOf(jid){const c=capOf(judgeOf(jid));return c?c.fields:[];}
function ttlOf(jid,bid){const f=capFieldsOf(jid),e=entry(jid,bid);if(!f.length)return null;const v=f.map(k=>e[k]);if(v.some(x=>x==null||x===''))return null;return (Number(v[0])+Number(v[1]))/10;}
function isComplete(jid,bid){const f=capFieldsOf(jid),e=entry(jid,bid);return f.length&&f.every(k=>e[k]!=null&&e[k]!=='');}
function computeStandings(jid){
  const rows=curBands().map(b=>({band:b,ttl:bandLocked(b)?null:ttlOf(jid,b.id)}));
  const ent=rows.filter(r=>r.ttl!=null);ent.forEach(r=>r.rank=1+ent.filter(o=>o.ttl>r.ttl).length);
  return rows.sort((a,b)=>{if(a.ttl==null&&b.ttl==null)return a.band.no-b.band.no;if(a.ttl==null)return 1;if(b.ttl==null)return -1;return a.rank-b.rank||a.band.no-b.band.no;});
}
/* full recap engine (shared) */
const FACTOR=f=>(FAMILIES[f]&&FAMILIES[f].factor)||(f==='GE'?2:1.5);
function allTtl(jid,bid){const c=capOf(judgeOf(jid));if(!c)return null;const s=state.allScores[jid]&&state.allScores[jid][bid];if(!s)return null;const v=c.fields.map(k=>s[k]);if(v.some(x=>x==null||x===''))return null;return (Number(v[0])+Number(v[1]))/10;}
function famSub(bid,fam,hasCG){let caps;if(fam==='Visual'){const vis=CAPTIONS.filter(c=>c.family==='Visual');caps=(hasCG?vis:vis.filter(c=>!c.isCG));}else caps=CAPTIONS.filter(c=>c.family===fam);
  const t=caps.map(c=>{const j=JUDGES.find(j=>j.captionId===c.id);return j?allTtl(j.id,bid):null;}).filter(x=>x!=null);
  if(!t.length)return null;return (t.reduce((a,b)=>a+b,0)/t.length)*FACTOR(fam);}
function finalOf(band){const e=famSub(band.id,'GE',band.hasCG!==false),v=famSub(band.id,'Visual',band.hasCG!==false),m=famSub(band.id,'Music',band.hasCG!==false);return (e||0)+(v||0)+(m||0);}
function prizeOf(band,final){const r=PRIZE.find(p=>p.classId===band.classId);if(!r||final==null)return'';if(final>=r.gold)return'金賞';if(final>=r.silver)return'銀賞';if(r.bronze!=null&&final>=r.bronze)return'銅賞';return'';}

/* ===================== boot ===================== */
const app=document.getElementById('app');
async function loadConfig(){try{const res=await fetch(cfgURL);if(!res.ok)throw 0;const c=await res.json();if(!c||!c.captions)throw 0;lsSet(LS.cfg,c);return c;}catch(e){const c=lsGet(LS.cfg,null);if(c)return c;throw new Error('設定を読み込めません');}}
async function boot(){
  app.innerHTML='<div style="padding:70px 22px;text-align:center;color:#8b96ad">設定を読み込み中…</div>';
  try{
    const cfg=await loadConfig();
    CAPTIONS=cfg.captions;JUDGES=cfg.judges;BANDS=cfg.bands;EV=cfg.event||EV;
    DIVISIONS=cfg.divisions||[];CLASSES=cfg.classes||[];FAMILIES=cfg.families||{};PRIZE=cfg.prizeRules||[];
    state.curDiv=(DIVISIONS[0]||{}).id||null;
    render();flush();pollShare();setInterval(pollShare,8000);
  }catch(e){app.innerHTML='<div style="padding:60px 24px;text-align:center;color:#e8705a;line-height:1.8">設定を読み込めませんでした。<br>ネット接続を確認して再読み込みしてください。</div>';}
}
async function pollShare(){
  try{const s=await (await fetch(shareURL)).json();const ns=(s&&s.state)||'none';
    if(ns!==state.shareState){state.shareState=ns;if(state.tab==='ranking')render();}
    else state.shareState=ns;}catch(e){}
  if(state.shareState==='shared'){try{state.allScores=(await (await fetch(allScoresURL)).json())||{};if(state.tab==='ranking'&&state.rankMode==='final')render();}catch(e){}}
}
async function loadStatus(){try{const s=await (await fetch(statusURL(state.judgeId))).json();state.decided=!!(s&&s.decided);}catch(e){state.decided=false;}}
function putStatus(){fetch(statusURL(state.judgeId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({decided:state.decided,at:Date.now()})}).catch(()=>{});}

/* ===================== render ===================== */
function render(){state.judgeId?renderMain():renderSelect();}

function renderSelect(){
  const FAM={GE:'General Effect',Visual:'Visual',Music:'Music'};const groups={GE:[],Visual:[],Music:[]};
  JUDGES.forEach(j=>{const c=capOf(j);if(c&&groups[c.family])groups[c.family].push(j);});
  app.innerHTML=`<div class="body"><div class="sel">
    <h1>${EV.name||'Marching Matsuri'}</h1><p>お名前を選んでください</p>
    ${Object.keys(groups).map(f=>groups[f].length?`<div class="famlabel">${FAM[f]}</div>`+groups[f].map(j=>{const c=capOf(j);
      return `<button class="jb" data-j="${j.id}"><span><span class="n">${j.name}</span><span class="c">${c?c.name:''}</span></span><span class="chev">›</span></button>`;}).join(''):'').join('')}
  </div></div>`;
  app.querySelectorAll('.jb').forEach(b=>b.addEventListener('click',async()=>{state.judgeId=b.dataset.j;state.bandIndex=0;state.tab='input';await loadStatus();render();}));
}

function renderMain(){
  const judge=judgeOf(state.judgeId),cap=capOf(judge);
  const divtabs=DIVISIONS.length>1?`<div class="divtabs">${DIVISIONS.map(d=>`<button class="divtab ${d.id===state.curDiv?'active':''}" data-dv="${d.id}">${d.name}</button>`).join('')}</div>`:'';
  app.innerHTML=`
    <div class="top">
      <div class="who"><div class="nm">${judge.name}</div><div class="cap">${cap?cap.name:''}</div></div>
      <span class="pill ok" id="syncpill">同期済み</span>
      <button class="ghost" id="switch">変更</button>
    </div>
    ${divtabs}
    <div class="tabs">
      <button class="tab ${state.tab==='criteria'?'active':''}" data-tab="criteria">審査項目</button>
      <button class="tab ${state.tab==='input'?'active':''}" data-tab="input">スコア入力</button>
      <button class="tab ${state.tab==='ranking'?'active':''}" data-tab="ranking">ランキング</button>
    </div>
    <div class="body" id="body"></div>
    ${state.tab==='input'?`<div class="decide"><button class="decidebtn ${state.decided?'done':''}" id="decide">${state.decided?'✓ 決定済み（タップで取消）':'全て入力・確認したら決定'}</button><div class="decidenote">決定すると管理画面に反映されます</div></div>`:''}`;
  // wire top/tabs
  app.querySelector('#switch').addEventListener('click',()=>{state.judgeId=null;render();});
  app.querySelectorAll('.divtab').forEach(b=>b.addEventListener('click',()=>{state.curDiv=b.dataset.dv;state.bandIndex=0;state.buf='';render();}));
  app.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;state.buf='';render();if(state.tab==='ranking')pollShare();}));
  const dec=app.querySelector('#decide');if(dec)dec.addEventListener('click',toggleDecide);
  updateSync();
  if(state.tab==='criteria')renderCriteria();
  else if(state.tab==='ranking')renderRanking();
  else renderInput();
}

function renderCriteria(){
  const cap=capOf(judgeOf(state.judgeId));const fields=cap?cap.fields:[];
  document.getElementById('body').innerHTML=`<div class="crit">
    <div class="band">${cap?cap.name:''} の審査項目</div>
    ${fields.map((f,i)=>`<div class="item"><h3>${i===0?'①':'②'} ${f} <span style="color:var(--muted);font-weight:400">/100</span></h3><p>${FIELD_DESC[f]||''}</p></div>`).join('')}
    <p class="note"><code>Total = (① + ②) ÷ 10</code>（20点満点）<br>各団体に①②を0〜100で入力します。合計・順位は自動計算されます。</p>
    ${isCGJudge()?'<p class="note">カラーガード「無」の団体は入力不要です（自動でロックされます）。</p>':''}
  </div>`;
}

function renderInput(){
  const judge=judgeOf(state.judgeId),cap=capOf(judge),bands=curBands();
  if(state.bandIndex>=bands.length)state.bandIndex=0;
  const band=bands[state.bandIndex];const body=document.getElementById('body');
  if(!band){body.innerHTML='<div style="padding:50px 20px;text-align:center;color:var(--muted)">この部門に団体がありません。</div>';return;}
  const fields=cap.fields;const e=entry(judge.id,band.id);
  const locked=bandLocked(band);
  const bar=`<div class="bandbar">
      <button class="navbtn" id="prev" ${state.bandIndex===0?'disabled':''}>‹</button>
      <div class="bn"><span class="no">NO.${String(band.no).padStart(2,'0')}　${state.bandIndex+1}/${bands.length}</span>
      <div class="tm">${band.name}</div><div class="meta">${clsLabel(band)}${band.hasCG===false?' · CG無':' · CG有'}</div></div>
      <button class="navbtn" id="next">›</button></div>`;
  if(locked){
    body.innerHTML=`<div class="inp">${bar}<div class="cglock"><div class="big">カラーガード 無</div>この団体は入力不要です。<br>「›」で次の団体へ進んでください。</div></div>`;
    wireNav(bands);return;
  }
  const ttl=ttlOf(judge.id,band.id);const st=computeStandings(judge.id);const me=st.find(r=>r.band.id===band.id);
  const cmt=(state.comments[judge.id]&&state.comments[judge.id][band.id])||'';
  body.innerHTML=`<div class="inp">
    ${bar}
    <div class="fields">
      ${fields.map((f,i)=>{const v=e[f];const has=(v!=null&&v!=='');return `<div class="fbox ${state.active===i?'active':''}" data-f="${i}">
        <div class="fl">${i===0?'①':'②'} ${f}</div><div class="fv ${has?'':'empty'}">${has?v:'––'}</div></div>`;}).join('')}
    </div>
    <div class="ttlbar"><span class="lab">Total</span><span class="val">${ttl!=null?ttl.toFixed(2):'––.––'}</span>${me&&me.rank?`<span class="rk">${me.rank}位</span>`:''}</div>
    <div class="cmt"><input id="cmt" placeholder="コメント（任意）" value="${String(cmt).replace(/"/g,'&quot;')}"></div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
      <button class="key util" data-k="back">⌫</button>
      <button class="key" data-k="0">0</button>
      <button class="key util" data-k="clear">C</button>
    </div>
  </div>`;
  // wire fields
  body.querySelectorAll('.fbox').forEach(fb=>fb.addEventListener('click',()=>{state.active=+fb.dataset.f;state.buf=String(e[fields[state.active]]??'');render();}));
  body.querySelectorAll('.key').forEach(k=>k.addEventListener('click',()=>onKey(k.dataset.k)));
  const ci=document.getElementById('cmt');ci.addEventListener('input',()=>onComment(ci.value));
  wireNav(bands);
}
function wireNav(bands){
  const p=document.getElementById('prev'),n=document.getElementById('next');
  if(p)p.addEventListener('click',()=>{if(state.bandIndex>0){state.bandIndex--;state.active=0;state.buf='';render();}});
  if(n)n.addEventListener('click',()=>{state.bandIndex=(state.bandIndex+1)%bands.length;state.active=0;state.buf='';render();});
}
function onKey(k){
  const judge=judgeOf(state.judgeId),cap=capOf(judge),band=curBands()[state.bandIndex];
  const field=cap.fields[state.active];
  let buf=state.buf||'';
  if(k==='clear')buf='';
  else if(k==='back')buf=buf.slice(0,-1);
  else{const nb=buf+k;if(parseInt(nb,10)>100)buf=k==='0'?'100':String(parseInt(k,10));else buf=nb.replace(/^0+(?=\d)/,'');}
  state.buf=buf;
  const val=buf===''?null:Math.min(100,parseInt(buf,10));
  state.scores[judge.id]=state.scores[judge.id]||{};state.scores[judge.id][band.id]=state.scores[judge.id][band.id]||{};
  if(val==null)delete state.scores[judge.id][band.id][field];else state.scores[judge.id][band.id][field]=val;
  if(Object.keys(state.scores[judge.id][band.id]).length===0)delete state.scores[judge.id][band.id];
  persist();enqueue('score',judge.id,band.id);autoUndecide();
  // auto-advance to 2nd field when 1st reaches 2+ digits? keep manual. just refresh values
  refreshInputValues();
}
function refreshInputValues(){
  const judge=judgeOf(state.judgeId),cap=capOf(judge),band=curBands()[state.bandIndex];const e=entry(judge.id,band.id);
  const boxes=document.querySelectorAll('.fbox');
  cap.fields.forEach((f,i)=>{if(boxes[i]){const v=e[f];const has=(v!=null&&v!=='');const fv=boxes[i].querySelector('.fv');fv.textContent=has?v:'––';fv.classList.toggle('empty',!has);boxes[i].classList.toggle('active',state.active===i);}});
  const ttl=ttlOf(judge.id,band.id);const tv=document.querySelector('.ttlbar .val');if(tv)tv.textContent=ttl!=null?ttl.toFixed(2):'––.––';
  const st=computeStandings(judge.id);const me=st.find(r=>r.band.id===band.id);const rk=document.querySelector('.ttlbar .rk');if(rk)rk.textContent=me&&me.rank?me.rank+'位':'';
}
function onComment(v){
  const judge=judgeOf(state.judgeId),band=curBands()[state.bandIndex];
  state.comments[judge.id]=state.comments[judge.id]||{};
  if(v.trim()==='')delete state.comments[judge.id][band.id];else state.comments[judge.id][band.id]=v;
  persist();enqueue('comment',judge.id,band.id);autoUndecide();
}
function autoUndecide(){ if(state.decided){state.decided=false;putStatus();const d=document.getElementById('decide');if(d){d.className='decidebtn';d.textContent='全て入力・確認したら決定';}} }
function toggleDecide(){state.decided=!state.decided;putStatus();const d=document.getElementById('decide');if(d){d.className='decidebtn'+(state.decided?' done':'');d.textContent=state.decided?'✓ 決定済み（タップで取消）':'全て入力・確認したら決定';}}

function renderRanking(){
  const judge=judgeOf(state.judgeId);const shared=state.shareState==='shared';
  const body=document.getElementById('body');
  const toggle=`<div class="rtoggle">
    <button class="${state.rankMode==='self'?'active':''}" data-rm="self">自分の採点順</button>
    <button class="${state.rankMode==='final'?'active':''}" data-rm="final" ${shared?'':'disabled'}>最終リキャップ${shared?'':'（共有待ち）'}</button></div>`;
  if(state.rankMode==='final'&&shared){
    const bands=curBands().map(b=>({band:b,final:finalOf(b)}));
    const ent=bands.filter(r=>r.final!=null);ent.forEach(r=>r.rank=1+ent.filter(o=>o.final>r.final).length);
    ent.sort((a,b)=>a.rank-b.rank||a.band.no-b.band.no);
    const counts={};ent.forEach(r=>{const k=r.final.toFixed(3);counts[k]=(counts[k]||0)+1;});
    body.innerHTML=`<div class="rank final">${toggle}
      <div class="st-head"><span></span><span class="hn">団体</span><span>GE</span><span>Vis/Mus</span><span>Final</span></div>
      ${ent.map(r=>{const e=famSub(r.band.id,'GE',r.band.hasCG!==false),v=famSub(r.band.id,'Visual',r.band.hasCG!==false),m=famSub(r.band.id,'Music',r.band.hasCG!==false);
        return `<div class="st-row"><span class="st-rk">${r.rank}</span>
        <span class="st-nm"><span class="no">${String(r.band.no).padStart(2,'0')}</span><span class="bn">${r.band.name}</span></span>
        <span class="st-sub">${e!=null?e.toFixed(1):'–'}</span><span class="st-sub">${v!=null?v.toFixed(1):'–'}/${m!=null?m.toFixed(1):'–'}</span>
        <span class="st-ttl">${r.final.toFixed(3)}</span></div>`;}).join('')}
      <p class="rinfo">全ジャッジ集計後の最終順位（${divName(state.curDiv)}）。運営が共有した確定データです。</p></div>`;
  }else{
    const st=computeStandings(judge.id);const cap=capOf(judge);const f=cap?cap.fields:['①','②'];
    const counts={};st.forEach(r=>{if(r.ttl!=null){const k=r.ttl.toFixed(2);counts[k]=(counts[k]||0)+1;}});
    const ties=Object.values(counts).filter(c=>c>1).length;
    const curId=(curBands()[state.bandIndex]||{}).id;
    body.innerHTML=`<div class="rank">${toggle}
      ${ties?`<div class="st-warn">⚠ 同点が ${ties}組あります</div>`:''}
      <div class="st-head"><span></span><span class="hn">団体</span><span>${f[0]}</span><span>${f[1]}</span><span>Total</span></div>
      ${st.map(r=>{const empty=r.ttl==null;const tie=!empty&&counts[r.ttl.toFixed(2)]>1;const e=entry(judge.id,r.band.id);
        return `<div class="st-row ${r.band.id===curId?'cur':''} ${empty?'empty':''} ${tie?'tie':''}">
        <span class="st-rk">${empty?'–':r.rank}</span>
        <span class="st-nm"><span class="no">${String(r.band.no).padStart(2,'0')}</span><span class="bn">${r.band.name}</span></span>
        <span class="st-sub">${empty?'–':(e[f[0]]??'–')}</span><span class="st-sub">${empty?'–':(e[f[1]]??'–')}</span>
        <span class="st-ttl">${empty?'––.––':r.ttl.toFixed(2)}</span></div>`;}).join('')}
      <p class="rinfo">あなたの採点順（${divName(state.curDiv)}）。${shared?'「最終リキャップ」で全体順位も見られます。':'全体の最終順位は運営が共有後に表示されます。'}</p></div>`;
  }
  body.querySelectorAll('.rtoggle button').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;state.rankMode=b.dataset.rm;if(state.rankMode==='final')pollShare();render();}));
}

// ピンチズームの誤作動だけ抑止（ダブルタップズームは touch-action:manipulation で無効化済み・タップ入力は妨げない）
document.addEventListener('gesturestart',function(e){e.preventDefault();});

boot();
</script>
</body>
</html>
